name: Destroy ALL AWS Resources

on:
  workflow_dispatch:

jobs:
  destroy:
    name: Force Delete All AWS Resources
    runs-on: ubuntu-latest
    env:
      AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}

    steps:
      - name: Configure AWS Credentials
        if: env.AWS_KEY != ''
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Destroy All AWS Resources
        if: env.AWS_KEY != ''
        run: |
          P="ticketdesk"
          R="us-east-1"

          echo "======================================================"
          echo " 💣 INITIATING COMPLETE TEARDOWN OF ALL RESOURCES"
          echo "======================================================"

          # ── 1. ECS Services & Cluster ──────────────────────
          echo "Stopping ECS services..."
          for svc in ${P}-eureka-service ${P}-gateway-service ${P}-auth-service \
            ${P}-ticket-service ${P}-comment-service ${P}-attachment-service ${P}-dashboard-service; do
            aws ecs update-service --cluster ${P}-cluster --service "$svc" \
              --desired-count 0 --region $R 2>/dev/null || true
            aws ecs delete-service --cluster ${P}-cluster --service "$svc" \
              --force --region $R 2>/dev/null || true
          done
          aws ecs delete-cluster --cluster ${P}-cluster --region $R 2>/dev/null || true

          # ── 2. ALB, Listeners & Target Groups ──────────────
          echo "Deleting ALB..."
          ALB_ARN=$(aws elbv2 describe-load-balancers --names ${P}-alb \
            --query 'LoadBalancers[0].LoadBalancerArn' --output text --region $R 2>/dev/null || echo "")
          if [ -n "$ALB_ARN" ] && [ "$ALB_ARN" != "None" ]; then
            LISTENERS=$(aws elbv2 describe-listeners --load-balancer-arn "$ALB_ARN" \
              --query 'Listeners[*].ListenerArn' --output text --region $R 2>/dev/null || echo "")
            for L in $LISTENERS; do
              aws elbv2 delete-listener --listener-arn "$L" --region $R 2>/dev/null || true
            done
            aws elbv2 delete-load-balancer --load-balancer-arn "$ALB_ARN" --region $R || true
          fi

          # ── 3. RDS Instance (Delete & Wait) ────────────────
          echo "Deleting RDS instance (initiating delete)..."
          aws rds delete-db-instance \
            --db-instance-identifier ${P}-db \
            --skip-final-snapshot \
            --delete-automated-backups \
            --region $R 2>/dev/null || true

          # ── 4. ECR Repositories ────────────────────────────
          echo "Deleting ECR repositories..."
          for repo in ${P}-eureka-server ${P}-frontend ${P}-api-gateway \
            ${P}-auth-service ${P}-ticket-service ${P}-comment-service \
            ${P}-attachment-service ${P}-dashboard-service; do
            aws ecr delete-repository --repository-name "$repo" --force --region $R 2>/dev/null || true
          done

          # ── 5. CloudWatch Log Group ────────────────────────
          echo "Deleting CloudWatch log group..."
          aws logs delete-log-group --log-group-name "/ecs/${P}" --region $R 2>/dev/null || true

          # ── 6. Secrets Manager ─────────────────────────────
          echo "Deleting Secrets Manager secret..."
          aws secretsmanager delete-secret --secret-id ${P}-db-credentials-v2 \
            --force-delete-without-recovery --region $R 2>/dev/null || true

          # ── 7. S3 Buckets ──────────────────────────────────
          echo "Emptying and deleting S3 buckets..."
          BUCKETS=$(aws s3api list-buckets --query "Buckets[?starts_with(Name, '${P}')].Name" --output text 2>/dev/null || echo "")
          for b in $BUCKETS; do
            [ -z "$b" ] || [ "$b" == "None" ] && continue
            aws s3 rm "s3://$b" --recursive 2>/dev/null || true
            VERSIONS=$(aws s3api list-object-versions --bucket "$b" --query '{Objects: Versions[].{Key:Key,VersionId:VersionId}}' --output json 2>/dev/null || echo "")
            MARKERS=$(aws s3api list-object-versions --bucket "$b" --query '{Objects: DeleteMarkers[].{Key:Key,VersionId:VersionId}}' --output json 2>/dev/null || echo "")
            [ -n "$VERSIONS" ] && [ "$VERSIONS" != "null" ] && aws s3api delete-objects --bucket "$b" --delete "$VERSIONS" 2>/dev/null || true
            [ -n "$MARKERS" ] && [ "$MARKERS" != "null" ] && aws s3api delete-objects --bucket "$b" --delete "$MARKERS" 2>/dev/null || true
            aws s3api delete-bucket --bucket "$b" --region $R 2>/dev/null || true
          done

          # ── 8. Wait for ALB and RDS deletion to complete ──
          echo "⏳ Waiting for ALB and RDS instance to be fully deleted..."
          aws elbv2 wait load-balancers-deleted --names ${P}-alb --region $R 2>/dev/null || true
          aws rds wait db-instance-deleted --db-instance-identifier ${P}-db --region $R 2>/dev/null || true
          echo "ALB and RDS instance are fully deleted!"

          # ── 9. Delete RDS Subnet Group ─────────────────────
          echo "Deleting RDS subnet group..."
          aws rds delete-db-subnet-group --db-subnet-group-name ${P}-db-subnet-group --region $R 2>/dev/null || true

          # ── 10. IAM Roles ──────────────────────────────────
          echo "Deleting IAM roles..."
          for role in ${P}-ecs-execution-role ${P}-ecs-task-role; do
            POLICIES=$(aws iam list-attached-role-policies --role-name "$role" --query 'AttachedPolicies[*].PolicyArn' --output text 2>/dev/null || echo "")
            for p in $POLICIES; do
              aws iam detach-role-policy --role-name "$role" --policy-arn "$p" 2>/dev/null || true
            done
            aws iam delete-role --role-name "$role" 2>/dev/null || true
          done

          # ── 11. ALB Target Groups ──────────────────────────
          echo "Deleting target groups..."
          for tg in ${P}-eureka-tg ${P}-gateway-tg; do
            TG_ARN=$(aws elbv2 describe-target-groups --names "$tg" --query 'TargetGroups[0].TargetGroupArn' --output text --region $R 2>/dev/null || echo "")
            [ -n "$TG_ARN" ] && [ "$TG_ARN" != "None" ] && aws elbv2 delete-target-group --target-group-arn "$TG_ARN" --region $R 2>/dev/null || true
          done

          # ── 12. Security Groups ────────────────────────────
          echo "Deleting security groups..."
          for sg in ${P}-alb-sg ${P}-ecs-tasks-sg ${P}-rds-sg; do
            SG_ID=$(aws ec2 describe-security-groups --filters "Name=group-name,Values=$sg" --query 'SecurityGroups[0].GroupId' --output text --region $R 2>/dev/null || echo "")
            [ -n "$SG_ID" ] && [ "$SG_ID" != "None" ] && aws ec2 delete-security-group --group-id "$SG_ID" --region $R 2>/dev/null || true
          done

          # ── 13. VPCs ───────────────────────────────────────
          echo "Deleting non-default VPCs..."
          VPCS=$(aws ec2 describe-vpcs --query 'Vpcs[?IsDefault==`false`].VpcId' --output text --region $R 2>/dev/null || echo "")
          for vpc in $VPCS; do
            [ -z "$vpc" ] || [ "$vpc" == "None" ] && continue
            SUBNETS=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$vpc" --query 'Subnets[*].SubnetId' --output text --region $R 2>/dev/null || echo "")
            for sn in $SUBNETS; do aws ec2 delete-subnet --subnet-id "$sn" --region $R 2>/dev/null || true; done
            IGW=$(aws ec2 describe-internet-gateways --filters "Name=attachment.vpc-id,Values=$vpc" --query 'InternetGateways[0].InternetGatewayId' --output text --region $R 2>/dev/null || echo "")
            if [ -n "$IGW" ] && [ "$IGW" != "None" ]; then
              aws ec2 detach-internet-gateway --internet-gateway-id "$IGW" --vpc-id "$vpc" --region $R 2>/dev/null || true
              aws ec2 delete-internet-gateway --internet-gateway-id "$IGW" --region $R 2>/dev/null || true
            fi
            RTS=$(aws ec2 describe-route-tables --filters "Name=vpc-id,Values=$vpc" --query 'RouteTables[?Associations[?Main!=`true`]].RouteTableId' --output text --region $R 2>/dev/null || echo "")
            for rt in $RTS; do aws ec2 delete-route-table --route-table-id "$rt" --region $R 2>/dev/null || true; done
            aws ec2 delete-vpc --vpc-id "$vpc" --region $R 2>/dev/null || true
          done

          echo "======================================================"
          echo " 🎉 ALL AWS RESOURCES HAVE BEEN FORCE DELETED SUCCESSFULLY!"
          echo "======================================================"
