name: Deploy Entire Application (ECS Fargate + ECR + RDS + S3)

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Full Deployment Pipeline
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      P: ticketdesk
      AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}

    steps:
      # ─────────────────────────────────────────────────────
      # 1. Checkout
      # ─────────────────────────────────────────────────────
      - name: Checkout Code
        uses: actions/checkout@v3

      # ─────────────────────────────────────────────────────
      # 2. Configure AWS from GitHub Secrets
      # ─────────────────────────────────────────────────────
      - name: Configure AWS Credentials
        if: env.AWS_KEY != ''
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # ─────────────────────────────────────────────────────
      # 3. Delete STATELESS resources before terraform runs
      #    (ALB, TGs, Listeners, SGs, ECS, CW, IAM, RDS subnet group)
      #    These are safe to delete — terraform will recreate them.
      #    We KEEP: VPC, RDS instance, ECR repos (stateful data)
      # ─────────────────────────────────────────────────────
      - name: Delete Conflicting Stateless AWS Resources
        if: env.AWS_KEY != ''
        run: |
          P="ticketdesk"
          R="us-east-1"

          echo "=== [1/8] Deleting ALB + Listeners + Target Groups ==="
          ALB_ARN=$(aws elbv2 describe-load-balancers --names ${P}-alb \
            --query 'LoadBalancers[0].LoadBalancerArn' --output text --region $R 2>/dev/null || echo "")
          if [ -n "$ALB_ARN" ] && [ "$ALB_ARN" != "None" ]; then
            echo "Deleting listeners on ALB..."
            LISTENERS=$(aws elbv2 describe-listeners --load-balancer-arn "$ALB_ARN" \
              --query 'Listeners[*].ListenerArn' --output text --region $R 2>/dev/null || echo "")
            for L in $LISTENERS; do
              aws elbv2 delete-listener --listener-arn "$L" --region $R 2>/dev/null || true
            done
            echo "Deleting ALB..."
            aws elbv2 delete-load-balancer --load-balancer-arn "$ALB_ARN" --region $R || true
            sleep 20
          fi
          for tg in ${P}-eureka-tg ${P}-gateway-tg; do
            TG_ARN=$(aws elbv2 describe-target-groups --names "$tg" \
              --query 'TargetGroups[0].TargetGroupArn' --output text --region $R 2>/dev/null || echo "")
            [ -n "$TG_ARN" ] && [ "$TG_ARN" != "None" ] && \
              aws elbv2 delete-target-group --target-group-arn "$TG_ARN" --region $R 2>/dev/null || true
          done

          echo "=== [2/8] Deleting ECS Services + Cluster ==="
          for svc in ${P}-eureka-service ${P}-gateway-service ${P}-auth-service \
            ${P}-ticket-service ${P}-comment-service ${P}-attachment-service ${P}-dashboard-service; do
            aws ecs update-service --cluster ${P}-cluster --service "$svc" \
              --desired-count 0 --region $R 2>/dev/null || true
            aws ecs delete-service --cluster ${P}-cluster --service "$svc" \
              --force --region $R 2>/dev/null || true
          done
          aws ecs delete-cluster --cluster ${P}-cluster --region $R 2>/dev/null || true

          echo "=== [3/8] Deleting Security Groups ==="
          for sg in ${P}-alb-sg ${P}-ecs-tasks-sg ${P}-rds-sg; do
            SG_ID=$(aws ec2 describe-security-groups --filters "Name=group-name,Values=$sg" \
              --query 'SecurityGroups[0].GroupId' --output text --region $R 2>/dev/null || echo "")
            [ -n "$SG_ID" ] && [ "$SG_ID" != "None" ] && \
              aws ec2 delete-security-group --group-id "$SG_ID" --region $R 2>/dev/null || true
          done

          echo "=== [4/8] Deleting CloudWatch Log Group ==="
          aws logs delete-log-group --log-group-name "/ecs/${P}" --region $R 2>/dev/null || true

          echo "=== [5/8] Deleting IAM Roles ==="
          for role in ${P}-ecs-execution-role ${P}-ecs-task-role; do
            POLICIES=$(aws iam list-attached-role-policies --role-name "$role" \
              --query 'AttachedPolicies[*].PolicyArn' --output text 2>/dev/null || echo "")
            for p in $POLICIES; do
              aws iam detach-role-policy --role-name "$role" --policy-arn "$p" 2>/dev/null || true
            done
            aws iam delete-role --role-name "$role" 2>/dev/null || true
          done

          echo "=== [6/8] Deleting RDS Subnet Group (NOT the RDS instance) ==="
          aws rds delete-db-subnet-group \
            --db-subnet-group-name ${P}-db-subnet-group --region $R 2>/dev/null || true

          echo "=== [7/8] Deleting Secrets Manager Secret ==="
          aws secretsmanager delete-secret --secret-id ${P}-db-credentials-v2 \
            --force-delete-without-recovery --region $R 2>/dev/null || true

          echo "=== [8/8] Removing orphaned VPCs (keeping ticketdesk-vpc) ==="
          VPCS=$(aws ec2 describe-vpcs \
            --query 'Vpcs[?IsDefault==`false`].VpcId' \
            --output text --region $R 2>/dev/null || echo "")
          for vpc in $VPCS; do
            [ -z "$vpc" ] || [ "$vpc" == "None" ] && continue
            VPC_NAME=$(aws ec2 describe-vpcs --vpc-ids "$vpc" \
              --query 'Vpcs[0].Tags[?Key==`Name`].Value | [0]' \
              --output text --region $R 2>/dev/null || echo "")
            if [ "$VPC_NAME" == "${P}-vpc" ]; then
              echo "Keeping ${P}-vpc ($vpc) — will import into Terraform."
              continue
            fi
            echo "Deleting orphaned VPC: $vpc"
            SUBNETS=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$vpc" \
              --query 'Subnets[*].SubnetId' --output text --region $R 2>/dev/null || echo "")
            for sn in $SUBNETS; do aws ec2 delete-subnet --subnet-id "$sn" --region $R 2>/dev/null || true; done
            IGW=$(aws ec2 describe-internet-gateways \
              --filters "Name=attachment.vpc-id,Values=$vpc" \
              --query 'InternetGateways[0].InternetGatewayId' --output text --region $R 2>/dev/null || echo "")
            if [ -n "$IGW" ] && [ "$IGW" != "None" ]; then
              aws ec2 detach-internet-gateway --internet-gateway-id "$IGW" --vpc-id "$vpc" --region $R 2>/dev/null || true
              aws ec2 delete-internet-gateway --internet-gateway-id "$IGW" --region $R 2>/dev/null || true
            fi
            SGS=$(aws ec2 describe-security-groups --filters "Name=vpc-id,Values=$vpc" \
              --query 'SecurityGroups[?GroupName!=`default`].GroupId' --output text --region $R 2>/dev/null || echo "")
            for sg in $SGS; do aws ec2 delete-security-group --group-id "$sg" --region $R 2>/dev/null || true; done
            aws ec2 delete-vpc --vpc-id "$vpc" --region $R 2>/dev/null || true
          done
          echo "=== Pre-cleanup complete! ==="

      # ─────────────────────────────────────────────────────
      # 4. Terraform Init
      # ─────────────────────────────────────────────────────
      - name: Setup Terraform
        if: env.AWS_KEY != ''
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Terraform Init
        if: env.AWS_KEY != ''
        working-directory: ./terraform
        run: terraform init

      # ─────────────────────────────────────────────────────
      # 5. Import STATEFUL resources (VPC, ECR, RDS instance)
      #    These must be preserved across runs.
      # ─────────────────────────────────────────────────────
      - name: Import Stateful Resources into Terraform State
        if: env.AWS_KEY != ''
        working-directory: ./terraform
        run: |
          P="ticketdesk"
          R="us-east-1"

          echo "=== Importing VPC + Subnets + IGW + Route Tables ==="
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Name,Values=${P}-vpc" \
            --query 'Vpcs[0].VpcId' --output text --region $R 2>/dev/null || echo "")

          if [ -n "$VPC_ID" ] && [ "$VPC_ID" != "None" ]; then
            echo "Found existing VPC: $VPC_ID — importing..."
            terraform import aws_vpc.main "$VPC_ID" 2>/dev/null || true

            PUB_SUBNETS=$(aws ec2 describe-subnets \
              --filters "Name=vpc-id,Values=$VPC_ID" "Name=tag:Name,Values=${P}-public-subnet-*" \
              --query 'Subnets | sort_by(@, &AvailabilityZone)[*].SubnetId' \
              --output text --region $R 2>/dev/null || echo "")
            i=0
            for sn in $PUB_SUBNETS; do
              terraform import "aws_subnet.public[$i]" "$sn" 2>/dev/null || true
              i=$((i+1))
            done

            PRIV_SUBNETS=$(aws ec2 describe-subnets \
              --filters "Name=vpc-id,Values=$VPC_ID" "Name=tag:Name,Values=${P}-private-subnet-*" \
              --query 'Subnets | sort_by(@, &AvailabilityZone)[*].SubnetId' \
              --output text --region $R 2>/dev/null || echo "")
            i=0
            for sn in $PRIV_SUBNETS; do
              terraform import "aws_subnet.private[$i]" "$sn" 2>/dev/null || true
              i=$((i+1))
            done

            IGW=$(aws ec2 describe-internet-gateways \
              --filters "Name=attachment.vpc-id,Values=$VPC_ID" \
              --query 'InternetGateways[0].InternetGatewayId' --output text --region $R 2>/dev/null || echo "")
            [ -n "$IGW" ] && [ "$IGW" != "None" ] && \
              terraform import aws_internet_gateway.igw "$IGW" 2>/dev/null || true

            PUB_RT=$(aws ec2 describe-route-tables \
              --filters "Name=vpc-id,Values=$VPC_ID" "Name=tag:Name,Values=${P}-public-rt" \
              --query 'RouteTables[0].RouteTableId' --output text --region $R 2>/dev/null || echo "")
            [ -n "$PUB_RT" ] && [ "$PUB_RT" != "None" ] && \
              terraform import aws_route_table.public "$PUB_RT" 2>/dev/null || true

            PRIV_RT=$(aws ec2 describe-route-tables \
              --filters "Name=vpc-id,Values=$VPC_ID" "Name=tag:Name,Values=${P}-private-rt" \
              --query 'RouteTables[0].RouteTableId' --output text --region $R 2>/dev/null || echo "")
            [ -n "$PRIV_RT" ] && [ "$PRIV_RT" != "None" ] && \
              terraform import aws_route_table.private "$PRIV_RT" 2>/dev/null || true
          else
            echo "No existing VPC found — Terraform will create a fresh one."
          fi

          echo "=== Importing ECR Repositories ==="
          for repo in eureka-server frontend api-gateway auth-service \
                      ticket-service comment-service attachment-service dashboard-service; do
            tf_name=$(echo $repo | tr '-' '_')
            terraform import "aws_ecr_repository.${tf_name}" "${P}-${repo}" 2>/dev/null || true
          done

          echo "=== Importing RDS Instance (preserve DB data) ==="
          RDS=$(aws rds describe-db-instances \
            --db-instance-identifier ${P}-db \
            --query 'DBInstances[0].DBInstanceIdentifier' \
            --output text --region $R 2>/dev/null || echo "")
          [ -n "$RDS" ] && [ "$RDS" != "None" ] && \
            terraform import aws_db_instance.mysql ${P}-db 2>/dev/null || true

          echo "=== Import complete! ==="

      # ─────────────────────────────────────────────────────
      # 6. Terraform Apply
      # ─────────────────────────────────────────────────────
      - name: Terraform Apply
        if: env.AWS_KEY != ''
        working-directory: ./terraform
        run: terraform apply -auto-approve
        env:
          TF_VAR_aws_region: us-east-1

      # ─────────────────────────────────────────────────────
      # 7. Build React Frontend
      # ─────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Build React Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Deploy Frontend to S3
        if: env.AWS_KEY != ''
        run: |
          BUCKET=$(aws s3api list-buckets \
            --query "Buckets[?starts_with(Name, 'ticketdesk-frontend')].Name" \
            --output text 2>/dev/null | tr '\t' '\n' | head -n 1 || echo "")
          if [ -n "$BUCKET" ] && [ "$BUCKET" != "None" ]; then
            aws s3 sync frontend/dist "s3://$BUCKET" --delete --region us-east-1
            echo "Frontend deployed to s3://$BUCKET"
          fi

      # ─────────────────────────────────────────────────────
      # 8. Login to ECR & Build/Push Docker Images
      # ─────────────────────────────────────────────────────
      - name: Login to Amazon ECR
        if: env.AWS_KEY != ''
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Push All Docker Images to ECR
        if: env.AWS_KEY != ''
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          TAG=$(git rev-parse --short HEAD)
          push_image() {
            local name=$1 ctx=$2
            echo "--- Building ticketdesk-${name} ---"
            docker build \
              -t $ECR_REGISTRY/ticketdesk-${name}:${TAG} \
              -t $ECR_REGISTRY/ticketdesk-${name}:latest ${ctx}
            docker push $ECR_REGISTRY/ticketdesk-${name}:${TAG}
            docker push $ECR_REGISTRY/ticketdesk-${name}:latest
          }
          push_image "eureka-server"      "./backend/eureka-server"
          push_image "api-gateway"        "./backend/api-gateway"
          push_image "auth-service"       "./backend/auth-service"
          push_image "ticket-service"     "./backend/ticket-service"
          push_image "comment-service"    "./backend/comment-service"
          push_image "attachment-service" "./backend/attachment-service"
          push_image "dashboard-service"  "./backend/dashboard-service"
          push_image "frontend"           "./frontend"

      # ─────────────────────────────────────────────────────
      # 9. Force ECS Redeployment
      # ─────────────────────────────────────────────────────
      - name: Force ECS Redeployment
        if: env.AWS_KEY != ''
        run: |
          for svc in ticketdesk-eureka-service ticketdesk-gateway-service \
            ticketdesk-auth-service ticketdesk-ticket-service \
            ticketdesk-comment-service ticketdesk-attachment-service \
            ticketdesk-dashboard-service; do
            aws ecs update-service --cluster ticketdesk-cluster \
              --service "$svc" --force-new-deployment --region us-east-1 2>/dev/null || true
          done
          echo "=== All ECS services redeployed! ==="

      # ─────────────────────────────────────────────────────
      # 10. Print Access URLs
      # ─────────────────────────────────────────────────────
      - name: Print Access URLs
        if: env.AWS_KEY != ''
        working-directory: ./terraform
        run: |
          echo "=========================================="
          echo " 🎉 DEPLOYMENT COMPLETE!"
          echo "=========================================="
          echo " Frontend  : $(terraform output -raw frontend_s3_url 2>/dev/null || echo 'check S3 bucket')"
          echo " Eureka    : $(terraform output -raw eureka_dashboard_url 2>/dev/null || echo 'check ALB:8761')"
          echo " API GW    : $(terraform output -raw api_gateway_url 2>/dev/null || echo 'check ALB:80')"
          echo "=========================================="
