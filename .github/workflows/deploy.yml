name: CI/CD Pipeline (Build, ECR, Terraform & ECS Deploy)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci-cd-pipeline:
    name: Build, Test, ECR Push & Terraform ECS Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Scan for Committed Secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Backend Unit Tests (Maven)
        run: |
          for dir in backend/*/; do
            if [ -f "$dir/pom.xml" ]; then
              echo "Testing $dir..."
              mvn -file "$dir/pom.xml" test -DskipTests
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Run Frontend Build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Get Short Git Commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Configure AWS Credentials
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        if: github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build & Push Docker Images to ECR
        if: github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.vars.outputs.sha_short }}
        run: |
          # Build & Push containers tagged with Git commit SHA
          docker build -t $ECR_REGISTRY/ticketdesk-frontend:$IMAGE_TAG ./frontend
          docker push $ECR_REGISTRY/ticketdesk-frontend:$IMAGE_TAG

          docker build -t $ECR_REGISTRY/ticketdesk-api-gateway:$IMAGE_TAG ./backend/api-gateway
          docker push $ECR_REGISTRY/ticketdesk-api-gateway:$IMAGE_TAG

          docker build -t $ECR_REGISTRY/ticketdesk-auth-service:$IMAGE_TAG ./backend/auth-service
          docker push $ECR_REGISTRY/ticketdesk-auth-service:$IMAGE_TAG

          docker build -t $ECR_REGISTRY/ticketdesk-ticket-service:$IMAGE_TAG ./backend/ticket-service
          docker push $ECR_REGISTRY/ticketdesk-ticket-service:$IMAGE_TAG

          docker build -t $ECR_REGISTRY/ticketdesk-comment-service:$IMAGE_TAG ./backend/comment-service
          docker push $ECR_REGISTRY/ticketdesk-comment-service:$IMAGE_TAG

          docker build -t $ECR_REGISTRY/ticketdesk-attachment-service:$IMAGE_TAG ./backend/attachment-service
          docker push $ECR_REGISTRY/ticketdesk-attachment-service:$IMAGE_TAG

          docker build -t $ECR_REGISTRY/ticketdesk-dashboard-service:$IMAGE_TAG ./backend/dashboard-service
          docker push $ECR_REGISTRY/ticketdesk-dashboard-service:$IMAGE_TAG

          docker build -t $ECR_REGISTRY/ticketdesk-eureka-server:$IMAGE_TAG ./backend/eureka-server
          docker push $ECR_REGISTRY/ticketdesk-eureka-server:$IMAGE_TAG

          echo "Successfully pushed all containers to Amazon ECR with tag $IMAGE_TAG"

      - name: Setup Terraform
        if: github.ref == 'refs/heads/main'
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Terraform Init & Apply
        if: github.ref == 'refs/heads/main'
        working-directory: ./terraform
        run: |
          terraform init
          terraform plan -out=tfplan
          terraform apply -auto-approve tfplan

      - name: Force New ECS Deployment (Update Service)
        if: github.ref == 'refs/heads/main'
        run: |
          aws ecs update-service --cluster ticketdesk-cluster --service ticketdesk-api-service --force-new-deployment || true
