name: Deploy Entire Application

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Full Deployment Pipeline
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      P: ticketdesk
      AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}

    steps:
      # ──────────────────────────────────────────────────────
      # 1. Checkout
      # ──────────────────────────────────────────────────────
      - name: Checkout Code
        uses: actions/checkout@v4

      # ──────────────────────────────────────────────────────
      # 2. AWS Credentials
      # ──────────────────────────────────────────────────────
      - name: Configure AWS Credentials
        if: env.AWS_KEY != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # ──────────────────────────────────────────────────────
      # 3. Pre-Cleanup: Delete stateless resources ONLY
      #    KEEP: VPC, RDS instance, ECR repos, S3 bucket, RDS SG
      # ──────────────────────────────────────────────────────
      - name: Pre-Cleanup Stateless Resources
        if: env.AWS_KEY != ''
        run: |
          P="ticketdesk"
          R="us-east-1"

          echo "--- [1] Scale down + delete ECS Services ---"
          for svc in ${P}-eureka-service ${P}-gateway-service ${P}-auth-service \
            ${P}-ticket-service ${P}-comment-service ${P}-attachment-service ${P}-dashboard-service; do
            aws ecs update-service --cluster ${P}-cluster --service "$svc" \
              --desired-count 0 --region $R 2>/dev/null || true
            aws ecs delete-service --cluster ${P}-cluster --service "$svc" \
              --force --region $R 2>/dev/null || true
          done
          aws ecs delete-cluster --cluster ${P}-cluster --region $R 2>/dev/null || true

          echo "--- [2] Delete ALB + Listeners ---"
          ALB_ARN=$(aws elbv2 describe-load-balancers --names ${P}-alb \
            --query 'LoadBalancers[0].LoadBalancerArn' --output text --region $R 2>/dev/null || echo "")
          if [ -n "$ALB_ARN" ] && [ "$ALB_ARN" != "None" ]; then
            for L in $(aws elbv2 describe-listeners --load-balancer-arn "$ALB_ARN" \
              --query 'Listeners[*].ListenerArn' --output text --region $R 2>/dev/null); do
              aws elbv2 delete-listener --listener-arn "$L" --region $R 2>/dev/null || true
            done
            aws elbv2 delete-load-balancer --load-balancer-arn "$ALB_ARN" --region $R 2>/dev/null || true
            echo "Waiting 30s for ALB deletion..."
            sleep 30
          fi

          echo "--- [3] Delete Target Groups ---"
          for tg in ${P}-eureka-tg ${P}-gateway-tg; do
            TG_ARN=$(aws elbv2 describe-target-groups --names "$tg" \
              --query 'TargetGroups[0].TargetGroupArn' --output text --region $R 2>/dev/null || echo "")
            [ -n "$TG_ARN" ] && [ "$TG_ARN" != "None" ] && \
              aws elbv2 delete-target-group --target-group-arn "$TG_ARN" --region $R 2>/dev/null || true
          done

          echo "--- [4] Delete IAM Roles ---"
          for role in ${P}-ecs-execution-role ${P}-ecs-task-role; do
            for pol in $(aws iam list-attached-role-policies --role-name "$role" \
              --query 'AttachedPolicies[*].PolicyArn' --output text 2>/dev/null); do
              aws iam detach-role-policy --role-name "$role" --policy-arn "$pol" 2>/dev/null || true
            done
            aws iam delete-role --role-name "$role" 2>/dev/null || true
          done

          echo "--- [5] Delete Secrets Manager Secret ---"
          aws secretsmanager delete-secret --secret-id ${P}-db-credentials-v2 \
            --force-delete-without-recovery --region $R 2>/dev/null || true

          echo "--- [6] Delete CloudWatch Log Group ---"
          aws logs delete-log-group --log-group-name "/ecs/${P}" --region $R 2>/dev/null || true

          echo "--- [7] Delete RDS Subnet Group ---"
          aws rds delete-db-subnet-group \
            --db-subnet-group-name ${P}-db-subnet-group --region $R 2>/dev/null || true

          echo "--- [8] Delete ALB + ECS SGs only (RDS SG preserved!) ---"
          for sg_name in ${P}-alb-sg ${P}-ecs-tasks-sg; do
            SG_ID=$(aws ec2 describe-security-groups \
              --filters "Name=group-name,Values=$sg_name" \
              --query 'SecurityGroups[0].GroupId' --output text --region $R 2>/dev/null || echo "")
            if [ -n "$SG_ID" ] && [ "$SG_ID" != "None" ]; then
              aws ec2 delete-security-group --group-id "$SG_ID" --region $R 2>/dev/null || true
              echo "  Deleted $sg_name ($SG_ID)"
            fi
          done
          echo "  ✅ RDS SG preserved (stable across deploys)"

          echo "=== Pre-cleanup complete ==="

      # ──────────────────────────────────────────────────────
      # 4. Terraform Setup + Init + Import + Apply
      # ──────────────────────────────────────────────────────
      - name: Setup Terraform
        if: env.AWS_KEY != ''
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0
          terraform_wrapper: false

      - name: Terraform Init
        if: env.AWS_KEY != ''
        working-directory: ./terraform
        run: terraform init

      - name: Import Stateful Resources (VPC, ECR, RDS, S3)
        if: env.AWS_KEY != ''
        working-directory: ./terraform
        run: |
          P="ticketdesk"
          R="us-east-1"

          echo "=== Importing VPC ==="
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Name,Values=${P}-vpc" \
            --query 'Vpcs[0].VpcId' --output text --region $R 2>/dev/null || echo "")
          if [ -n "$VPC_ID" ] && [ "$VPC_ID" != "None" ]; then
            echo "VPC found: $VPC_ID"
            terraform import aws_vpc.main "$VPC_ID" 2>/dev/null || true

            PUB_SUBNETS=$(aws ec2 describe-subnets \
              --filters "Name=vpc-id,Values=$VPC_ID" "Name=tag:Name,Values=${P}-public-subnet-*" \
              --query 'Subnets | sort_by(@, &AvailabilityZone)[*].SubnetId' \
              --output text --region $R 2>/dev/null || echo "")
            i=0
            for sn in $PUB_SUBNETS; do
              terraform import "aws_subnet.public[$i]" "$sn" 2>/dev/null || true
              i=$((i+1))
            done

            PRIV_SUBNETS=$(aws ec2 describe-subnets \
              --filters "Name=vpc-id,Values=$VPC_ID" "Name=tag:Name,Values=${P}-private-subnet-*" \
              --query 'Subnets | sort_by(@, &AvailabilityZone)[*].SubnetId' \
              --output text --region $R 2>/dev/null || echo "")
            i=0
            for sn in $PRIV_SUBNETS; do
              terraform import "aws_subnet.private[$i]" "$sn" 2>/dev/null || true
              i=$((i+1))
            done

            IGW=$(aws ec2 describe-internet-gateways \
              --filters "Name=attachment.vpc-id,Values=$VPC_ID" \
              --query 'InternetGateways[0].InternetGatewayId' --output text --region $R 2>/dev/null || echo "")
            [ -n "$IGW" ] && [ "$IGW" != "None" ] && \
              terraform import aws_internet_gateway.igw "$IGW" 2>/dev/null || true

            PUB_RT=$(aws ec2 describe-route-tables \
              --filters "Name=vpc-id,Values=$VPC_ID" "Name=tag:Name,Values=${P}-public-rt" \
              --query 'RouteTables[0].RouteTableId' --output text --region $R 2>/dev/null || echo "")
            [ -n "$PUB_RT" ] && [ "$PUB_RT" != "None" ] && \
              terraform import aws_route_table.public "$PUB_RT" 2>/dev/null || true

            PRIV_RT=$(aws ec2 describe-route-tables \
              --filters "Name=vpc-id,Values=$VPC_ID" "Name=tag:Name,Values=${P}-private-rt" \
              --query 'RouteTables[0].RouteTableId' --output text --region $R 2>/dev/null || echo "")
            [ -n "$PRIV_RT" ] && [ "$PRIV_RT" != "None" ] && \
              terraform import aws_route_table.private "$PRIV_RT" 2>/dev/null || true
          fi

          echo "=== Importing ECR Repos ==="
          for repo in eureka-server frontend api-gateway auth-service \
                      ticket-service comment-service attachment-service dashboard-service; do
            tf_name=$(echo $repo | tr '-' '_')
            terraform import "aws_ecr_repository.${tf_name}" "${P}-${repo}" 2>/dev/null || true
          done

          echo "=== Importing RDS Instance ==="
          RDS=$(aws rds describe-db-instances \
            --db-instance-identifier ${P}-db \
            --query 'DBInstances[0].DBInstanceIdentifier' \
            --output text --region $R 2>/dev/null || echo "")
          [ -n "$RDS" ] && [ "$RDS" != "None" ] && \
            terraform import aws_db_instance.mysql ${P}-db 2>/dev/null || true

          echo "=== Importing Security Groups ==="
          SG_RDS=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=${P}-rds-sg" \
            --query 'SecurityGroups[0].GroupId' --output text --region $R 2>/dev/null || echo "")
          [ -n "$SG_RDS" ] && [ "$SG_RDS" != "None" ] && \
            terraform import aws_security_group.rds_sg "$SG_RDS" 2>/dev/null || true

          echo "=== Importing DB Subnet Group ==="
          DBSN=$(aws rds describe-db-subnet-groups \
            --db-subnet-group-name ${P}-db-subnet-group \
            --query 'DBSubnetGroups[0].DBSubnetGroupName' \
            --output text --region $R 2>/dev/null || echo "")
          [ -n "$DBSN" ] && [ "$DBSN" != "None" ] && \
            terraform import aws_db_subnet_group.main ${P}-db-subnet-group 2>/dev/null || true

          echo "=== Importing S3 Frontend Bucket ==="
          S3_BUCKET=$(aws s3api list-buckets \
            --query "Buckets[?starts_with(Name,'${P}-frontend')].Name | [0]" \
            --output text 2>/dev/null || echo "")
          if [ -n "$S3_BUCKET" ] && [ "$S3_BUCKET" != "None" ]; then
            echo "Found S3 bucket: $S3_BUCKET"
            terraform import aws_s3_bucket.frontend "$S3_BUCKET" 2>/dev/null || true
            terraform import aws_s3_bucket_website_configuration.frontend "$S3_BUCKET" 2>/dev/null || true
            terraform import aws_s3_bucket_cors_configuration.frontend "$S3_BUCKET" 2>/dev/null || true
            terraform import aws_s3_bucket_public_access_block.frontend "$S3_BUCKET" 2>/dev/null || true

            echo "  Force-disabling Block Public Access..."
            aws s3api put-public-access-block \
              --bucket "$S3_BUCKET" \
              --public-access-block-configuration \
                "BlockPublicAcls=false,IgnorePublicAcls=false,BlockPublicPolicy=false,RestrictPublicBuckets=false" \
              --region $R && echo "  ✅ Block Public Access disabled" || echo "  ⚠️ Could not disable"
          else
            echo "No existing S3 bucket — will be created fresh."
          fi

          echo "=== Import complete ==="

      - name: Terraform Apply
        if: env.AWS_KEY != ''
        working-directory: ./terraform
        run: terraform apply -auto-approve
        env:
          TF_VAR_aws_region: us-east-1

      # ──────────────────────────────────────────────────────
      # 5. Fix RDS Password + Security Groups
      #    This runs AFTER terraform apply every time to
      #    guarantee ECS tasks can reach RDS.
      # ──────────────────────────────────────────────────────
      - name: Fix RDS Password and Security Groups
        if: env.AWS_KEY != ''
        run: |
          echo "=== [A] Reset RDS master password to TicketDeskPass123! ==="
          aws rds modify-db-instance \
            --db-instance-identifier ticketdesk-db \
            --master-user-password "TicketDeskPass123!" \
            --apply-immediately \
            --region us-east-1 2>/dev/null || echo "⚠️ Password reset skipped"

          echo "=== [B] Wait for RDS to be available ==="
          for i in $(seq 1 20); do
            STATUS=$(aws rds describe-db-instances \
              --db-instance-identifier ticketdesk-db \
              --query 'DBInstances[0].DBInstanceStatus' \
              --output text --region us-east-1 2>/dev/null || echo "")
            echo "  [$i] RDS status: $STATUS"
            [ "$STATUS" = "available" ] && echo "  ✅ RDS is available!" && break
            sleep 15
          done

          echo "=== [C] Enforce RDS Security Group rules ==="
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Name,Values=ticketdesk-vpc" \
            --query 'Vpcs[0].VpcId' --output text --region us-east-1 2>/dev/null || echo "")

          RDS_SG=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=ticketdesk-rds-sg" "Name=vpc-id,Values=$VPC_ID" \
            --query 'SecurityGroups[0].GroupId' --output text --region us-east-1 2>/dev/null || echo "")

          ECS_SG=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=ticketdesk-ecs-tasks-sg" "Name=vpc-id,Values=$VPC_ID" \
            --query 'SecurityGroups[0].GroupId' --output text --region us-east-1 2>/dev/null || echo "")

          echo "  VPC=$VPC_ID | RDS_SG=$RDS_SG | ECS_SG=$ECS_SG"

          if [ -n "$RDS_SG" ] && [ "$RDS_SG" != "None" ]; then
            # Add VPC CIDR -> port 3306
            aws ec2 authorize-security-group-ingress \
              --group-id "$RDS_SG" --protocol tcp --port 3306 \
              --cidr 10.0.0.0/16 --region us-east-1 2>/dev/null && \
              echo "  ✅ VPC CIDR rule added" || echo "  ℹ️  VPC CIDR rule already exists"

            # Add new ECS SG -> port 3306
            if [ -n "$ECS_SG" ] && [ "$ECS_SG" != "None" ]; then
              aws ec2 authorize-security-group-ingress \
                --group-id "$RDS_SG" --protocol tcp --port 3306 \
                --source-group "$ECS_SG" --region us-east-1 2>/dev/null && \
                echo "  ✅ ECS SG rule added ($ECS_SG)" || echo "  ℹ️  ECS SG rule already exists"
            fi

            # Ensure RDS instance is attached to the correct SG
            aws rds modify-db-instance \
              --db-instance-identifier ticketdesk-db \
              --vpc-security-group-ids "$RDS_SG" \
              --apply-immediately --region us-east-1 2>/dev/null && \
              echo "  ✅ RDS SG updated" || echo "  ⚠️ RDS SG update skipped"
          else
            echo "  ❌ RDS SG not found!"
          fi

          echo "=== [D] Verify RDS endpoint and print DB URL ==="
          RDS_EP=$(aws rds describe-db-instances \
            --db-instance-identifier ticketdesk-db \
            --query 'DBInstances[0].Endpoint.Address' \
            --output text --region us-east-1 2>/dev/null || echo "")
          echo "  RDS Endpoint: $RDS_EP"
          echo "  DB URL: jdbc:mysql://$RDS_EP:3306/ticketdesk_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true"

      # ──────────────────────────────────────────────────────
      # 6. Get ALB DNS for frontend build
      # ──────────────────────────────────────────────────────
      - name: Get ALB DNS Name
        if: env.AWS_KEY != ''
        id: alb
        working-directory: ./terraform
        run: |
          ALB=$(terraform output -raw alb_dns_name 2>/dev/null || echo "")
          ALB=$(echo "$ALB" | tr -d '\r\n' | xargs)
          echo "ALB DNS: $ALB"
          echo "dns=$ALB" >> $GITHUB_OUTPUT

      # ──────────────────────────────────────────────────────
      # 7. Build React Frontend with ALB URL baked in
      # ──────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build React Frontend
        working-directory: ./frontend
        env:
          VITE_API_BASE: http://${{ steps.alb.outputs.dns }}/api/v1
        run: |
          echo "Building with VITE_API_BASE=$VITE_API_BASE"
          npm ci
          npm run build

      - name: Deploy Frontend to S3
        if: env.AWS_KEY != ''
        run: |
          BUCKET=$(aws s3api list-buckets \
            --query "Buckets[?starts_with(Name, 'ticketdesk-frontend')].Name" \
            --output text 2>/dev/null | tr '\t' '\n' | head -n 1 || echo "")
          if [ -n "$BUCKET" ] && [ "$BUCKET" != "None" ]; then
            echo "Deploying to s3://$BUCKET"
            aws s3 sync frontend/dist "s3://$BUCKET" --delete --region us-east-1
            echo "✅ Frontend deployed to $BUCKET"
          else
            echo "No S3 bucket found"
          fi

      # ──────────────────────────────────────────────────────
      # 8. Build & Push ALL Docker Images to ECR
      # ──────────────────────────────────────────────────────
      - name: Login to Amazon ECR
        if: env.AWS_KEY != ''
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Push All Docker Images to ECR
        if: env.AWS_KEY != ''
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          TAG=$(git rev-parse --short HEAD)
          echo "Image tag: $TAG"

          push_image() {
            local name=$1 ctx=$2
            echo ""
            echo "========== Building: ticketdesk-${name} =========="
            docker build \
              -t $ECR_REGISTRY/ticketdesk-${name}:${TAG} \
              -t $ECR_REGISTRY/ticketdesk-${name}:latest \
              ${ctx}
            docker push $ECR_REGISTRY/ticketdesk-${name}:${TAG}
            docker push $ECR_REGISTRY/ticketdesk-${name}:latest
            echo "✅ ticketdesk-${name} pushed"
          }

          push_image "eureka-server"      "./backend/eureka-server"
          push_image "api-gateway"        "./backend/api-gateway"
          push_image "auth-service"       "./backend/auth-service"
          push_image "ticket-service"     "./backend/ticket-service"
          push_image "comment-service"    "./backend/comment-service"
          push_image "attachment-service" "./backend/attachment-service"
          push_image "dashboard-service"  "./backend/dashboard-service"
          push_image "frontend"           "./frontend"

      # ──────────────────────────────────────────────────────
      # 9. Force ECS Redeployment
      # ──────────────────────────────────────────────────────
      - name: Force ECS Redeployment (All Services)
        if: env.AWS_KEY != ''
        run: |
          CLUSTER="ticketdesk-cluster"
          echo "=== Forcing redeployment of all ECS services ==="
          for svc in \
            ticketdesk-eureka-service \
            ticketdesk-gateway-service \
            ticketdesk-auth-service \
            ticketdesk-ticket-service \
            ticketdesk-comment-service \
            ticketdesk-attachment-service \
            ticketdesk-dashboard-service; do
            echo "  Redeploying $svc..."
            aws ecs update-service \
              --cluster "$CLUSTER" \
              --service "$svc" \
              --force-new-deployment \
              --region us-east-1 2>/dev/null || echo "  ⚠️ $svc not found"
          done
          echo "✅ All services redeployed"

      # ──────────────────────────────────────────────────────
      # 10. Wait for services to stabilize + print logs on failure
      # ──────────────────────────────────────────────────────
      - name: Wait for ECS Services + Health Check
        if: env.AWS_KEY != ''
        run: |
          echo "=== Waiting 90s for ECS services to start ==="
          sleep 90

          ALB_DNS=$(aws elbv2 describe-load-balancers \
            --names ticketdesk-alb \
            --query 'LoadBalancers[0].DNSName' \
            --output text --region us-east-1 2>/dev/null || echo "")

          echo "=== Testing login endpoint: http://$ALB_DNS/api/v1/auth/login ==="
          for i in $(seq 1 6); do
            RESP=$(curl -s -X POST "http://$ALB_DNS/api/v1/auth/login" \
              -H "Content-Type: application/json" \
              -d '{"email":"admin@ticketdesk.com","password":"admin123"}' \
              --max-time 15 2>/dev/null || echo "TIMEOUT")
            echo "  [$i] Response: $RESP"
            if echo "$RESP" | grep -q '"success":true'; then
              echo "  ✅✅✅ LOGIN SUCCESS — Application is FULLY WORKING! ✅✅✅"
              break
            fi
            [ $i -lt 6 ] && echo "  Waiting 30s..." && sleep 30
          done

          echo ""
          echo "=== Last 30 lines of auth-service CloudWatch logs ==="
          LOG_STREAM=$(aws logs describe-log-streams \
            --log-group-name "/ecs/ticketdesk" \
            --log-stream-name-prefix "auth/" \
            --order-by LastEventTime \
            --descending \
            --region us-east-1 \
            --query 'logStreams[0].logStreamName' \
            --output text 2>/dev/null || echo "")
          if [ -n "$LOG_STREAM" ] && [ "$LOG_STREAM" != "None" ]; then
            echo "  Log stream: $LOG_STREAM"
            aws logs get-log-events \
              --log-group-name "/ecs/ticketdesk" \
              --log-stream-name "$LOG_STREAM" \
              --limit 30 \
              --query 'events[*].message' \
              --output text \
              --region us-east-1 2>/dev/null | tail -30
          else
            echo "  No auth log stream found yet (service may still be starting)"
          fi

      # ──────────────────────────────────────────────────────
      # 11. Print Access URLs
      # ──────────────────────────────────────────────────────
      - name: Print Access URLs
        if: env.AWS_KEY != ''
        working-directory: ./terraform
        run: |
          ALB=$(terraform output -raw alb_dns_name 2>/dev/null || echo "N/A")
          FRONT=$(terraform output -raw frontend_s3_url 2>/dev/null || echo "N/A")
          RDS=$(terraform output -raw rds_endpoint 2>/dev/null || echo "N/A")
          echo ""
          echo "======================================================="
          echo " DEPLOYMENT COMPLETE!"
          echo "======================================================="
          echo " Frontend (S3) : $FRONT"
          echo " API Gateway   : http://$ALB/api/v1"
          echo " Eureka        : http://$ALB:8761"
          echo " RDS Endpoint  : $RDS"
          echo "======================================================="
          echo " Admin Login   : admin@ticketdesk.com / admin123"
          echo " User Login    : register a new account from the frontend"
          echo "======================================================="
          echo " NOTE: Use ONLY the Frontend URL above."
          echo "   DO NOT use old/cached ALB URLs from previous deploys."
          echo "======================================================="
