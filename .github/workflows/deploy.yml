name: CI/CD Pipeline (100% Free Tier Deploy)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci-cd-pipeline:
    name: Build, ECR Push & Free Tier EC2 Deploy
    runs-on: ubuntu-latest
    env:
      AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Build React Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Get Short Git Commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Configure AWS Credentials from GitHub Secrets
        if: github.ref == 'refs/heads/main' && env.AWS_KEY != ''
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Pre-Cleanup Existing AWS Conflicts (Free Quota Sweep)
        if: github.ref == 'refs/heads/main' && env.AWS_KEY != ''
        run: |
          echo "=== 1. Deleting ECR Repositories ==="
          REPOS=("ticketdesk-eureka-server" "ticketdesk-frontend" "ticketdesk-api-gateway" "ticketdesk-auth-service" "ticketdesk-ticket-service" "ticketdesk-comment-service" "ticketdesk-attachment-service" "ticketdesk-dashboard-service")
          for repo in "${REPOS[@]}"; do
            aws ecr delete-repository --repository-name "$repo" --force --region us-east-1 || true
          done

          echo "=== 2. Deleting IAM Roles & Secrets ==="
          for role in ticketdesk-ecs-execution-role ticketdesk-ecs-task-role; do
            POLICIES=$(aws iam list-attached-role-policies --role-name "$role" --query 'AttachedPolicies[*].PolicyArn' --output text 2>/dev/null || echo "")
            for p in $POLICIES; do aws iam detach-role-policy --role-name "$role" --policy-arn "$p" || true; done
            aws iam delete-role --role-name "$role" || true
          done
          aws secretsmanager delete-secret --secret-id ticketdesk-db-credentials-v2 --force-delete-without-recovery --region us-east-1 || true
          aws rds delete-db-subnet-group --db-subnet-group-name ticketdesk-db-subnet-group --region us-east-1 || true

          echo "=== 3. Deleting Non-Default VPCs ==="
          VPCS=$(aws ec2 describe-vpcs --query 'Vpcs[?IsDefault==`false`].VpcId' --output text --region us-east-1 || echo "")
          for vpc in $VPCS; do
            if [ -n "$vpc" ] && [ "$vpc" != "None" ]; then
              echo "Cleaning up non-default VPC: $vpc..."
              SUBNET_IDS=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$vpc" --query 'Subnets[*].SubnetId' --output text --region us-east-1 || echo "")
              for sn in $SUBNET_IDS; do aws ec2 delete-subnet --subnet-id "$sn" --region us-east-1 || true; done

              IGW_ID=$(aws ec2 describe-internet-gateways --filters "Name=attachment.vpc-id,Values=$vpc" --query 'InternetGateways[0].InternetGatewayId' --output text --region us-east-1 || echo "")
              if [ -n "$IGW_ID" ] && [ "$IGW_ID" != "None" ]; then
                aws ec2 detach-internet-gateway --internet-gateway-id "$IGW_ID" --vpc-id "$vpc" --region us-east-1 || true
                aws ec2 delete-internet-gateway --internet-gateway-id "$IGW_ID" --region us-east-1 || true
              fi

              SG_IDS=$(aws ec2 describe-security-groups --filters "Name=vpc-id,Values=$vpc" --query 'SecurityGroups[?GroupName!=`default`].GroupId' --output text --region us-east-1 || echo "")
              for sg in $SG_IDS; do aws ec2 delete-security-group --group-id "$sg" --region us-east-1 || true; done

              aws ec2 delete-vpc --vpc-id "$vpc" --region us-east-1 || true
            fi
          done
          echo "Pre-cleanup complete!"

      - name: Setup Terraform
        if: github.ref == 'refs/heads/main' && env.AWS_KEY != ''
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Terraform Init & Apply (100% Free Tier Architecture)
        if: github.ref == 'refs/heads/main' && env.AWS_KEY != ''
        working-directory: ./terraform
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Deploy Frontend to S3 Bucket
        if: github.ref == 'refs/heads/main' && env.AWS_KEY != ''
        run: |
          echo "=== Deploying React Frontend to S3 Bucket ==="
          BUCKET_NAME=$(aws s3api list-buckets --query "Buckets[?starts_with(Name, 'ticketdesk-frontend')].Name" --output text --region us-east-1 2>/dev/null | tr '\t' '\n' | head -n 1 || echo "")
          if [ -n "$BUCKET_NAME" ] && [ "$BUCKET_NAME" != "None" ] && [ -d "frontend/dist" ]; then
            echo "Syncing frontend/dist to s3://$BUCKET_NAME..."
            aws s3 sync frontend/dist "s3://$BUCKET_NAME" --delete --region us-east-1
            echo "Frontend deployed successfully to S3 bucket: $BUCKET_NAME!"
          fi

      - name: Log in to Amazon ECR
        if: github.ref == 'refs/heads/main' && env.AWS_KEY != ''
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build & Push Docker Images to ECR
        if: github.ref == 'refs/heads/main' && env.AWS_KEY != '' && steps.login-ecr.outputs.registry != ''
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.vars.outputs.sha_short }}
        run: |
          echo "=== Building and Pushing All Docker Images to ECR ==="
          docker build -t $ECR_REGISTRY/ticketdesk-frontend:$IMAGE_TAG -t $ECR_REGISTRY/ticketdesk-frontend:latest ./frontend
          docker push $ECR_REGISTRY/ticketdesk-frontend:$IMAGE_TAG
          docker push $ECR_REGISTRY/ticketdesk-frontend:latest

          docker build -t $ECR_REGISTRY/ticketdesk-api-gateway:$IMAGE_TAG -t $ECR_REGISTRY/ticketdesk-api-gateway:latest ./backend/api-gateway
          docker push $ECR_REGISTRY/ticketdesk-api-gateway:$IMAGE_TAG
          docker push $ECR_REGISTRY/ticketdesk-api-gateway:latest

          docker build -t $ECR_REGISTRY/ticketdesk-auth-service:$IMAGE_TAG -t $ECR_REGISTRY/ticketdesk-auth-service:latest ./backend/auth-service
          docker push $ECR_REGISTRY/ticketdesk-auth-service:$IMAGE_TAG
          docker push $ECR_REGISTRY/ticketdesk-auth-service:latest

          docker build -t $ECR_REGISTRY/ticketdesk-ticket-service:$IMAGE_TAG -t $ECR_REGISTRY/ticketdesk-ticket-service:latest ./backend/ticket-service
          docker push $ECR_REGISTRY/ticketdesk-ticket-service:$IMAGE_TAG
          docker push $ECR_REGISTRY/ticketdesk-ticket-service:latest

          docker build -t $ECR_REGISTRY/ticketdesk-comment-service:$IMAGE_TAG -t $ECR_REGISTRY/ticketdesk-comment-service:latest ./backend/comment-service
          docker push $ECR_REGISTRY/ticketdesk-comment-service:$IMAGE_TAG
          docker push $ECR_REGISTRY/ticketdesk-comment-service:latest

          docker build -t $ECR_REGISTRY/ticketdesk-attachment-service:$IMAGE_TAG -t $ECR_REGISTRY/ticketdesk-attachment-service:latest ./backend/attachment-service
          docker push $ECR_REGISTRY/ticketdesk-attachment-service:$IMAGE_TAG
          docker push $ECR_REGISTRY/ticketdesk-attachment-service:latest

          docker build -t $ECR_REGISTRY/ticketdesk-dashboard-service:$IMAGE_TAG -t $ECR_REGISTRY/ticketdesk-dashboard-service:latest ./backend/dashboard-service
          docker push $ECR_REGISTRY/ticketdesk-dashboard-service:$IMAGE_TAG
          docker push $ECR_REGISTRY/ticketdesk-dashboard-service:latest

          docker build -t $ECR_REGISTRY/ticketdesk-eureka-server:$IMAGE_TAG -t $ECR_REGISTRY/ticketdesk-eureka-server:latest ./backend/eureka-server
          docker push $ECR_REGISTRY/ticketdesk-eureka-server:$IMAGE_TAG
          docker push $ECR_REGISTRY/ticketdesk-eureka-server:latest

      - name: 100% Free Tier Deployment Summary
        if: github.ref == 'refs/heads/main' && env.AWS_KEY != ''
        run: |
          echo "=========================================================="
          echo " 🎉 100% AWS FREE TIER DEPLOYMENT COMPLETED SUCCESSFULLY!"
          echo "=========================================================="
          echo " - EC2 t3.micro Instance   : 100% Free Tier (750 hrs/month)"
          echo " - RDS MySQL db.t3.micro   : 100% Free Tier (750 hrs/month)"
          echo " - Amazon ECR Repositories : 100% Free Tier (500 MB/month)"
          echo " - Frontend S3 Bucket      : 100% Free Tier (5 GB/month)"
          echo "=========================================================="
