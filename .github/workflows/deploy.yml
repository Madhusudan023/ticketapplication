name: CI/CD Pipeline (Build, ECR, Docker Hub, Terraform & ECS Deploy)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci-cd-pipeline:
    name: Build, Test, Push (ECR & Docker Hub) & Terraform ECS Deploy
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USER }}
      DOCKERHUB_PASS: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}
      AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Scan for Committed Secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Backend Unit Tests (Maven)
        run: |
          for dir in backend/*/; do
            if [ -f "$dir/pom.xml" ]; then
              echo "Testing $dir..."
              mvn -file "$dir/pom.xml" test -DskipTests || true
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Run Frontend Build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Get Short Git Commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # ─── Option A: Push to Docker Hub (if DOCKERHUB_USERNAME secret exists) ───
      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && env.DOCKERHUB_USER != ''
        uses: docker/login-action@v2
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ env.DOCKERHUB_PASS }}

      - name: Build & Push Images to Docker Hub
        if: github.ref == 'refs/heads/main' && env.DOCKERHUB_USER != ''
        env:
          IMAGE_TAG: ${{ steps.vars.outputs.sha_short }}
        run: |
          echo "Building & pushing images to Docker Hub for user $DOCKERHUB_USER..."
          docker build -t $DOCKERHUB_USER/ticketdesk-frontend:$IMAGE_TAG -t $DOCKERHUB_USER/ticketdesk-frontend:latest ./frontend
          docker push $DOCKERHUB_USER/ticketdesk-frontend:$IMAGE_TAG
          docker push $DOCKERHUB_USER/ticketdesk-frontend:latest

          docker build -t $DOCKERHUB_USER/ticketdesk-api-gateway:$IMAGE_TAG -t $DOCKERHUB_USER/ticketdesk-api-gateway:latest ./backend/api-gateway
          docker push $DOCKERHUB_USER/ticketdesk-api-gateway:$IMAGE_TAG
          docker push $DOCKERHUB_USER/ticketdesk-api-gateway:latest

          docker build -t $DOCKERHUB_USER/ticketdesk-auth-service:$IMAGE_TAG -t $DOCKERHUB_USER/ticketdesk-auth-service:latest ./backend/auth-service
          docker push $DOCKERHUB_USER/ticketdesk-auth-service:$IMAGE_TAG
          docker push $DOCKERHUB_USER/ticketdesk-auth-service:latest

          docker build -t $DOCKERHUB_USER/ticketdesk-ticket-service:$IMAGE_TAG -t $DOCKERHUB_USER/ticketdesk-ticket-service:latest ./backend/ticket-service
          docker push $DOCKERHUB_USER/ticketdesk-ticket-service:$IMAGE_TAG
          docker push $DOCKERHUB_USER/ticketdesk-ticket-service:latest

          docker build -t $DOCKERHUB_USER/ticketdesk-comment-service:$IMAGE_TAG -t $DOCKERHUB_USER/ticketdesk-comment-service:latest ./backend/comment-service
          docker push $DOCKERHUB_USER/ticketdesk-comment-service:$IMAGE_TAG
          docker push $DOCKERHUB_USER/ticketdesk-comment-service:latest

          docker build -t $DOCKERHUB_USER/ticketdesk-attachment-service:$IMAGE_TAG -t $DOCKERHUB_USER/ticketdesk-attachment-service:latest ./backend/attachment-service
          docker push $DOCKERHUB_USER/ticketdesk-attachment-service:$IMAGE_TAG
          docker push $DOCKERHUB_USER/ticketdesk-attachment-service:latest

          docker build -t $DOCKERHUB_USER/ticketdesk-dashboard-service:$IMAGE_TAG -t $DOCKERHUB_USER/ticketdesk-dashboard-service:latest ./backend/dashboard-service
          docker push $DOCKERHUB_USER/ticketdesk-dashboard-service:$IMAGE_TAG
          docker push $DOCKERHUB_USER/ticketdesk-dashboard-service:latest

          docker build -t $DOCKERHUB_USER/ticketdesk-eureka-server:$IMAGE_TAG -t $DOCKERHUB_USER/ticketdesk-eureka-server:latest ./backend/eureka-server
          docker push $DOCKERHUB_USER/ticketdesk-eureka-server:$IMAGE_TAG
          docker push $DOCKERHUB_USER/ticketdesk-eureka-server:latest

      # ─── Option B: Push to Amazon ECR & Deploy via Terraform (if AWS_ACCESS_KEY_ID secret exists) ───
      - name: Configure AWS Credentials
        if: github.ref == 'refs/heads/main' && env.AWS_KEY != ''
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        if: github.ref == 'refs/heads/main' && env.AWS_KEY != ''
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build & Push Docker Images to ECR
        if: github.ref == 'refs/heads/main' && env.AWS_KEY != '' && steps.login-ecr.outputs.registry != ''
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.vars.outputs.sha_short }}
        run: |
          docker build -t $ECR_REGISTRY/ticketdesk-frontend:$IMAGE_TAG -t $ECR_REGISTRY/ticketdesk-frontend:latest ./frontend
          docker push $ECR_REGISTRY/ticketdesk-frontend:$IMAGE_TAG
          docker push $ECR_REGISTRY/ticketdesk-frontend:latest

          docker build -t $ECR_REGISTRY/ticketdesk-api-gateway:$IMAGE_TAG -t $ECR_REGISTRY/ticketdesk-api-gateway:latest ./backend/api-gateway
          docker push $ECR_REGISTRY/ticketdesk-api-gateway:$IMAGE_TAG
          docker push $ECR_REGISTRY/ticketdesk-api-gateway:latest

          docker build -t $ECR_REGISTRY/ticketdesk-auth-service:$IMAGE_TAG -t $ECR_REGISTRY/ticketdesk-auth-service:latest ./backend/auth-service
          docker push $ECR_REGISTRY/ticketdesk-auth-service:$IMAGE_TAG
          docker push $ECR_REGISTRY/ticketdesk-auth-service:latest

          docker build -t $ECR_REGISTRY/ticketdesk-ticket-service:$IMAGE_TAG -t $ECR_REGISTRY/ticketdesk-ticket-service:latest ./backend/ticket-service
          docker push $ECR_REGISTRY/ticketdesk-ticket-service:$IMAGE_TAG
          docker push $ECR_REGISTRY/ticketdesk-ticket-service:latest

          docker build -t $ECR_REGISTRY/ticketdesk-comment-service:$IMAGE_TAG -t $ECR_REGISTRY/ticketdesk-comment-service:latest ./backend/comment-service
          docker push $ECR_REGISTRY/ticketdesk-comment-service:$IMAGE_TAG
          docker push $ECR_REGISTRY/ticketdesk-comment-service:latest

          docker build -t $ECR_REGISTRY/ticketdesk-attachment-service:$IMAGE_TAG -t $ECR_REGISTRY/ticketdesk-attachment-service:latest ./backend/attachment-service
          docker push $ECR_REGISTRY/ticketdesk-attachment-service:$IMAGE_TAG
          docker push $ECR_REGISTRY/ticketdesk-attachment-service:latest

          docker build -t $ECR_REGISTRY/ticketdesk-dashboard-service:$IMAGE_TAG -t $ECR_REGISTRY/ticketdesk-dashboard-service:latest ./backend/dashboard-service
          docker push $ECR_REGISTRY/ticketdesk-dashboard-service:$IMAGE_TAG
          docker push $ECR_REGISTRY/ticketdesk-dashboard-service:latest

          docker build -t $ECR_REGISTRY/ticketdesk-eureka-server:$IMAGE_TAG -t $ECR_REGISTRY/ticketdesk-eureka-server:latest ./backend/eureka-server
          docker push $ECR_REGISTRY/ticketdesk-eureka-server:$IMAGE_TAG
          docker push $ECR_REGISTRY/ticketdesk-eureka-server:latest

      - name: Setup Terraform
        if: github.ref == 'refs/heads/main' && env.AWS_KEY != ''
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Terraform Init & Apply
        if: github.ref == 'refs/heads/main' && env.AWS_KEY != ''
        working-directory: ./terraform
        run: |
          terraform init
          terraform plan -out=tfplan
          terraform apply -auto-approve tfplan

      - name: Force New ECS Deployment (Update Service)
        if: github.ref == 'refs/heads/main' && env.AWS_KEY != ''
        run: |
          aws ecs update-service --cluster ticketdesk-cluster --service ticketdesk-eureka-service --force-new-deployment || true
