name: Deploy Entire Application (ECS Fargate + ECR + RDS + S3)

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Full Deployment Pipeline
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      P: ticketdesk
      AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}

    steps:
      # ─────────────────────────────────────────────────────
      # 1. Checkout
      # ─────────────────────────────────────────────────────
      - name: Checkout Code
        uses: actions/checkout@v3

      # ─────────────────────────────────────────────────────
      # 2. Configure AWS from GitHub Secrets
      # ─────────────────────────────────────────────────────
      - name: Configure AWS Credentials
        if: env.AWS_KEY != ''
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # ─────────────────────────────────────────────────────
      # 3. Remove ONLY truly orphaned VPCs (not our ticketdesk-vpc)
      #    This prevents VPC quota errors without breaking
      #    existing RDS subnet group → VPC associations.
      # ─────────────────────────────────────────────────────
      - name: Remove Orphaned VPCs (keep ticketdesk-vpc)
        if: env.AWS_KEY != ''
        run: |
          echo "=== Removing orphaned non-default VPCs (skipping ticketdesk-vpc) ==="
          VPCS=$(aws ec2 describe-vpcs \
            --query 'Vpcs[?IsDefault==`false`].VpcId' \
            --output text --region us-east-1 || echo "")
          for vpc in $VPCS; do
            [ -z "$vpc" ] || [ "$vpc" == "None" ] && continue
            VPC_NAME=$(aws ec2 describe-vpcs --vpc-ids "$vpc" \
              --query 'Vpcs[0].Tags[?Key==`Name`].Value | [0]' \
              --output text --region us-east-1 2>/dev/null || echo "")
            if [ "$VPC_NAME" == "ticketdesk-vpc" ]; then
              echo "Keeping our VPC ($vpc) — will be imported into Terraform state."
              continue
            fi
            echo "Deleting orphaned VPC: $vpc (Name=$VPC_NAME)"
            SUBNETS=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$vpc" \
              --query 'Subnets[*].SubnetId' --output text --region us-east-1 || echo "")
            for sn in $SUBNETS; do aws ec2 delete-subnet --subnet-id "$sn" --region us-east-1 2>/dev/null || true; done
            IGW=$(aws ec2 describe-internet-gateways \
              --filters "Name=attachment.vpc-id,Values=$vpc" \
              --query 'InternetGateways[0].InternetGatewayId' --output text --region us-east-1 || echo "")
            if [ -n "$IGW" ] && [ "$IGW" != "None" ]; then
              aws ec2 detach-internet-gateway --internet-gateway-id "$IGW" --vpc-id "$vpc" --region us-east-1 || true
              aws ec2 delete-internet-gateway --internet-gateway-id "$IGW" --region us-east-1 || true
            fi
            SGS=$(aws ec2 describe-security-groups --filters "Name=vpc-id,Values=$vpc" \
              --query 'SecurityGroups[?GroupName!=`default`].GroupId' --output text --region us-east-1 || echo "")
            for sg in $SGS; do aws ec2 delete-security-group --group-id "$sg" --region us-east-1 2>/dev/null || true; done
            aws ec2 delete-vpc --vpc-id "$vpc" --region us-east-1 || true
          done
          echo "VPC cleanup done."

      # ─────────────────────────────────────────────────────
      # 4. Terraform Init
      # ─────────────────────────────────────────────────────
      - name: Setup Terraform
        if: env.AWS_KEY != ''
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Terraform Init
        if: env.AWS_KEY != ''
        working-directory: ./terraform
        run: terraform init

      # ─────────────────────────────────────────────────────
      # 5. Import ALL existing AWS resources into Terraform state
      #    ✅ Exists  → imported → terraform apply just manages it (no error)
      #    ✅ Missing → import fails silently (|| true) → terraform creates it
      # ─────────────────────────────────────────────────────
      - name: Import Existing Resources into Terraform State
        if: env.AWS_KEY != ''
        working-directory: ./terraform
        run: |
          P="ticketdesk"
          REGION="us-east-1"
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)

          # ── VPC ──────────────────────────────────────────
          echo "=== VPC Resources ==="
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Name,Values=${P}-vpc" \
            --query 'Vpcs[0].VpcId' --output text --region $REGION 2>/dev/null || echo "")
          if [ -n "$VPC_ID" ] && [ "$VPC_ID" != "None" ]; then
            echo "Importing VPC: $VPC_ID"
            terraform import aws_vpc.main "$VPC_ID" 2>/dev/null || true

            # Public Subnets
            PUBLIC_SUBNETS=$(aws ec2 describe-subnets \
              --filters "Name=vpc-id,Values=$VPC_ID" "Name=tag:Name,Values=${P}-public-subnet-*" \
              --query 'Subnets | sort_by(@, &Tags[?Key==`Name`].Value | [0])[*].SubnetId' \
              --output text --region $REGION 2>/dev/null || echo "")
            i=0
            for sn in $PUBLIC_SUBNETS; do
              terraform import "aws_subnet.public[$i]" "$sn" 2>/dev/null || true
              i=$((i+1))
            done

            # Private Subnets
            PRIVATE_SUBNETS=$(aws ec2 describe-subnets \
              --filters "Name=vpc-id,Values=$VPC_ID" "Name=tag:Name,Values=${P}-private-subnet-*" \
              --query 'Subnets | sort_by(@, &Tags[?Key==`Name`].Value | [0])[*].SubnetId' \
              --output text --region $REGION 2>/dev/null || echo "")
            i=0
            for sn in $PRIVATE_SUBNETS; do
              terraform import "aws_subnet.private[$i]" "$sn" 2>/dev/null || true
              i=$((i+1))
            done

            # Internet Gateway
            IGW=$(aws ec2 describe-internet-gateways \
              --filters "Name=attachment.vpc-id,Values=$VPC_ID" \
              --query 'InternetGateways[0].InternetGatewayId' --output text --region $REGION 2>/dev/null || echo "")
            [ -n "$IGW" ] && [ "$IGW" != "None" ] && \
              terraform import aws_internet_gateway.igw "$IGW" 2>/dev/null || true

            # Route Tables
            PUBLIC_RT=$(aws ec2 describe-route-tables \
              --filters "Name=vpc-id,Values=$VPC_ID" "Name=tag:Name,Values=${P}-public-rt" \
              --query 'RouteTables[0].RouteTableId' --output text --region $REGION 2>/dev/null || echo "")
            [ -n "$PUBLIC_RT" ] && [ "$PUBLIC_RT" != "None" ] && \
              terraform import aws_route_table.public "$PUBLIC_RT" 2>/dev/null || true

            PRIVATE_RT=$(aws ec2 describe-route-tables \
              --filters "Name=vpc-id,Values=$VPC_ID" "Name=tag:Name,Values=${P}-private-rt" \
              --query 'RouteTables[0].RouteTableId' --output text --region $REGION 2>/dev/null || echo "")
            [ -n "$PRIVATE_RT" ] && [ "$PRIVATE_RT" != "None" ] && \
              terraform import aws_route_table.private "$PRIVATE_RT" 2>/dev/null || true

            # Route Table Associations
            if [ -n "$PUBLIC_RT" ] && [ "$PUBLIC_RT" != "None" ]; then
              i=0
              for sn in $PUBLIC_SUBNETS; do
                ASSOC=$(aws ec2 describe-route-tables \
                  --route-table-ids "$PUBLIC_RT" \
                  --query "RouteTables[0].Associations[?SubnetId=='$sn'].RouteTableAssociationId | [0]" \
                  --output text --region $REGION 2>/dev/null || echo "")
                [ -n "$ASSOC" ] && [ "$ASSOC" != "None" ] && \
                  terraform import "aws_route_table_association.public[$i]" "$ASSOC" 2>/dev/null || true
                i=$((i+1))
              done
            fi
            if [ -n "$PRIVATE_RT" ] && [ "$PRIVATE_RT" != "None" ]; then
              i=0
              for sn in $PRIVATE_SUBNETS; do
                ASSOC=$(aws ec2 describe-route-tables \
                  --route-table-ids "$PRIVATE_RT" \
                  --query "RouteTables[0].Associations[?SubnetId=='$sn'].RouteTableAssociationId | [0]" \
                  --output text --region $REGION 2>/dev/null || echo "")
                [ -n "$ASSOC" ] && [ "$ASSOC" != "None" ] && \
                  terraform import "aws_route_table_association.private[$i]" "$ASSOC" 2>/dev/null || true
                i=$((i+1))
              done
            fi
          fi

          # ── Security Groups ───────────────────────────────
          echo "=== Security Groups ==="
          for sg_name in alb-sg ecs-tasks-sg rds-sg; do
            tf_name=$(echo $sg_name | tr '-' '_' | sed 's/_sg$//')
            SG_ID=$(aws ec2 describe-security-groups \
              --filters "Name=group-name,Values=${P}-${sg_name}" \
              --query 'SecurityGroups[0].GroupId' --output text --region $REGION 2>/dev/null || echo "")
            if [ -n "$SG_ID" ] && [ "$SG_ID" != "None" ]; then
              echo "Importing security group: ${P}-${sg_name} → $SG_ID"
              terraform import "aws_security_group.${tf_name}_sg" "$SG_ID" 2>/dev/null || true
            fi
          done
          # Import ecs_tasks separately (different naming)
          ECS_SG=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=${P}-ecs-tasks-sg" \
            --query 'SecurityGroups[0].GroupId' --output text --region $REGION 2>/dev/null || echo "")
          [ -n "$ECS_SG" ] && [ "$ECS_SG" != "None" ] && \
            terraform import aws_security_group.ecs_tasks "$ECS_SG" 2>/dev/null || true
          ALB_SG=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=${P}-alb-sg" \
            --query 'SecurityGroups[0].GroupId' --output text --region $REGION 2>/dev/null || echo "")
          [ -n "$ALB_SG" ] && [ "$ALB_SG" != "None" ] && \
            terraform import aws_security_group.alb_sg "$ALB_SG" 2>/dev/null || true
          RDS_SG=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=${P}-rds-sg" \
            --query 'SecurityGroups[0].GroupId' --output text --region $REGION 2>/dev/null || echo "")
          [ -n "$RDS_SG" ] && [ "$RDS_SG" != "None" ] && \
            terraform import aws_security_group.rds_sg "$RDS_SG" 2>/dev/null || true

          # ── ALB + Target Groups + Listeners ───────────────
          echo "=== ALB Resources ==="
          ALB_ARN=$(aws elbv2 describe-load-balancers --names ${P}-alb \
            --query 'LoadBalancers[0].LoadBalancerArn' --output text --region $REGION 2>/dev/null || echo "")
          if [ -n "$ALB_ARN" ] && [ "$ALB_ARN" != "None" ]; then
            echo "Importing ALB: $ALB_ARN"
            terraform import aws_lb.main "$ALB_ARN" 2>/dev/null || true

            EUREKA_LISTENER=$(aws elbv2 describe-listeners \
              --load-balancer-arn "$ALB_ARN" \
              --query "Listeners[?Port==\`8761\`].ListenerArn | [0]" \
              --output text --region $REGION 2>/dev/null || echo "")
            [ -n "$EUREKA_LISTENER" ] && [ "$EUREKA_LISTENER" != "None" ] && \
              terraform import aws_lb_listener.eureka "$EUREKA_LISTENER" 2>/dev/null || true

            GW_LISTENER=$(aws elbv2 describe-listeners \
              --load-balancer-arn "$ALB_ARN" \
              --query "Listeners[?Port==\`80\`].ListenerArn | [0]" \
              --output text --region $REGION 2>/dev/null || echo "")
            [ -n "$GW_LISTENER" ] && [ "$GW_LISTENER" != "None" ] && \
              terraform import aws_lb_listener.api_gateway "$GW_LISTENER" 2>/dev/null || true
          fi

          EUREKA_TG=$(aws elbv2 describe-target-groups --names ${P}-eureka-tg \
            --query 'TargetGroups[0].TargetGroupArn' --output text --region $REGION 2>/dev/null || echo "")
          [ -n "$EUREKA_TG" ] && [ "$EUREKA_TG" != "None" ] && \
            terraform import aws_lb_target_group.eureka "$EUREKA_TG" 2>/dev/null || true

          GW_TG=$(aws elbv2 describe-target-groups --names ${P}-gateway-tg \
            --query 'TargetGroups[0].TargetGroupArn' --output text --region $REGION 2>/dev/null || echo "")
          [ -n "$GW_TG" ] && [ "$GW_TG" != "None" ] && \
            terraform import aws_lb_target_group.api_gateway "$GW_TG" 2>/dev/null || true

          # ── ECR Repos ─────────────────────────────────────
          echo "=== ECR Repositories ==="
          terraform import aws_ecr_repository.eureka_server      ${P}-eureka-server      2>/dev/null || true
          terraform import aws_ecr_repository.frontend           ${P}-frontend           2>/dev/null || true
          terraform import aws_ecr_repository.api_gateway        ${P}-api-gateway        2>/dev/null || true
          terraform import aws_ecr_repository.auth_service       ${P}-auth-service       2>/dev/null || true
          terraform import aws_ecr_repository.ticket_service     ${P}-ticket-service     2>/dev/null || true
          terraform import aws_ecr_repository.comment_service    ${P}-comment-service    2>/dev/null || true
          terraform import aws_ecr_repository.attachment_service ${P}-attachment-service 2>/dev/null || true
          terraform import aws_ecr_repository.dashboard_service  ${P}-dashboard-service  2>/dev/null || true

          # ── CloudWatch Log Group ──────────────────────────
          echo "=== CloudWatch Log Group ==="
          terraform import aws_cloudwatch_log_group.ecs /ecs/${P} 2>/dev/null || true

          # ── IAM Roles ─────────────────────────────────────
          echo "=== IAM Roles ==="
          terraform import aws_iam_role.ecs_execution_role ${P}-ecs-execution-role 2>/dev/null || true
          terraform import aws_iam_role.ecs_task_role      ${P}-ecs-task-role      2>/dev/null || true
          terraform import aws_iam_role_policy_attachment.ecs_execution_policy \
            "${P}-ecs-execution-role/arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy" 2>/dev/null || true
          terraform import aws_iam_role_policy_attachment.ecs_ecr_policy \
            "${P}-ecs-execution-role/arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly" 2>/dev/null || true

          # ── Secrets Manager ───────────────────────────────
          echo "=== Secrets Manager ==="
          SECRET_ARN=$(aws secretsmanager describe-secret \
            --secret-id ${P}-db-credentials-v2 \
            --query ARN --output text --region $REGION 2>/dev/null || echo "")
          [ -n "$SECRET_ARN" ] && [ "$SECRET_ARN" != "None" ] && \
            terraform import aws_secretsmanager_secret.db_secret "$SECRET_ARN" 2>/dev/null || true

          # ── RDS ───────────────────────────────────────────
          echo "=== RDS ==="
          terraform import aws_db_subnet_group.main ${P}-db-subnet-group 2>/dev/null || true
          RDS_ID=$(aws rds describe-db-instances \
            --db-instance-identifier ${P}-db \
            --query 'DBInstances[0].DBInstanceIdentifier' \
            --output text --region $REGION 2>/dev/null || echo "")
          [ -n "$RDS_ID" ] && [ "$RDS_ID" != "None" ] && \
            terraform import aws_db_instance.mysql ${P}-db 2>/dev/null || true

          # ── ECS Cluster ───────────────────────────────────
          echo "=== ECS Cluster ==="
          terraform import aws_ecs_cluster.main ${P}-cluster 2>/dev/null || true

          echo "=== ✅ All imports complete! ==="

      # ─────────────────────────────────────────────────────
      # 6. Terraform Apply
      # ─────────────────────────────────────────────────────
      - name: Terraform Apply
        if: env.AWS_KEY != ''
        working-directory: ./terraform
        run: terraform apply -auto-approve
        env:
          TF_VAR_aws_region: us-east-1

      # ─────────────────────────────────────────────────────
      # 7. Build & Deploy React Frontend to S3
      # ─────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Build React Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Deploy Frontend to S3
        if: env.AWS_KEY != ''
        run: |
          BUCKET=$(aws s3api list-buckets \
            --query "Buckets[?starts_with(Name, 'ticketdesk-frontend')].Name" \
            --output text 2>/dev/null | tr '\t' '\n' | head -n 1 || echo "")
          if [ -n "$BUCKET" ] && [ "$BUCKET" != "None" ]; then
            echo "Deploying to s3://$BUCKET ..."
            aws s3 sync frontend/dist "s3://$BUCKET" --delete --region us-east-1
          else
            echo "No S3 bucket found — skipping."
          fi

      # ─────────────────────────────────────────────────────
      # 8. Login to ECR & Push Docker Images
      # ─────────────────────────────────────────────────────
      - name: Login to Amazon ECR
        if: env.AWS_KEY != ''
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Push All Docker Images to ECR
        if: env.AWS_KEY != ''
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          TAG=$(git rev-parse --short HEAD)
          push_image() {
            local name=$1 ctx=$2
            echo "--- Building ticketdesk-${name} ---"
            docker build -t $ECR_REGISTRY/ticketdesk-${name}:${TAG} \
                         -t $ECR_REGISTRY/ticketdesk-${name}:latest ${ctx}
            docker push $ECR_REGISTRY/ticketdesk-${name}:${TAG}
            docker push $ECR_REGISTRY/ticketdesk-${name}:latest
          }
          push_image "eureka-server"      "./backend/eureka-server"
          push_image "api-gateway"        "./backend/api-gateway"
          push_image "auth-service"       "./backend/auth-service"
          push_image "ticket-service"     "./backend/ticket-service"
          push_image "comment-service"    "./backend/comment-service"
          push_image "attachment-service" "./backend/attachment-service"
          push_image "dashboard-service"  "./backend/dashboard-service"
          push_image "frontend"           "./frontend"

      # ─────────────────────────────────────────────────────
      # 9. Force ECS Redeployment
      # ─────────────────────────────────────────────────────
      - name: Force ECS Redeployment
        if: env.AWS_KEY != ''
        run: |
          for svc in ticketdesk-eureka-service ticketdesk-gateway-service \
            ticketdesk-auth-service ticketdesk-ticket-service \
            ticketdesk-comment-service ticketdesk-attachment-service \
            ticketdesk-dashboard-service; do
            aws ecs update-service --cluster ticketdesk-cluster \
              --service "$svc" --force-new-deployment --region us-east-1 2>/dev/null || true
          done
          echo "=== All ECS services redeployed! ==="

      # ─────────────────────────────────────────────────────
      # 10. Print Access URLs
      # ─────────────────────────────────────────────────────
      - name: Print Access URLs
        if: env.AWS_KEY != ''
        working-directory: ./terraform
        run: |
          echo "=========================================="
          echo " 🎉 DEPLOYMENT COMPLETE!"
          echo "=========================================="
          echo " Frontend  : $(terraform output -raw frontend_s3_url 2>/dev/null || echo 'check S3 bucket')"
          echo " Eureka    : $(terraform output -raw eureka_dashboard_url 2>/dev/null || echo 'check ALB:8761')"
          echo " API GW    : $(terraform output -raw api_gateway_url 2>/dev/null || echo 'check ALB:80')"
          echo "=========================================="
