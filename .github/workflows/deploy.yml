name: Deploy Entire Application (ECS Fargate + ECR + RDS + S3)

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Full Deployment Pipeline
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      PROJECT: ticketdesk
      AWS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}

    steps:
      # ─────────────────────────────────────────────────────
      # 1. Checkout
      # ─────────────────────────────────────────────────────
      - name: Checkout Code
        uses: actions/checkout@v3

      # ─────────────────────────────────────────────────────
      # 2. Configure AWS from GitHub Secrets
      # ─────────────────────────────────────────────────────
      - name: Configure AWS Credentials
        if: env.AWS_KEY != ''
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # ─────────────────────────────────────────────────────
      # 3. Clean VPC quota (only remove orphaned non-default VPCs)
      # ─────────────────────────────────────────────────────
      - name: Clean Up Orphaned VPCs (Free VPC quota)
        if: env.AWS_KEY != ''
        run: |
          echo "=== Removing non-default VPCs to free quota ==="
          VPCS=$(aws ec2 describe-vpcs --query 'Vpcs[?IsDefault==`false`].VpcId' \
            --output text --region us-east-1 || echo "")
          for vpc in $VPCS; do
            [ -z "$vpc" ] || [ "$vpc" == "None" ] && continue
            echo "Cleaning VPC: $vpc"
            SUBNETS=$(aws ec2 describe-subnets --filters "Name=vpc-id,Values=$vpc" \
              --query 'Subnets[*].SubnetId' --output text --region us-east-1 || echo "")
            for sn in $SUBNETS; do aws ec2 delete-subnet --subnet-id "$sn" --region us-east-1 2>/dev/null || true; done
            IGW=$(aws ec2 describe-internet-gateways \
              --filters "Name=attachment.vpc-id,Values=$vpc" \
              --query 'InternetGateways[0].InternetGatewayId' --output text --region us-east-1 || echo "")
            if [ -n "$IGW" ] && [ "$IGW" != "None" ]; then
              aws ec2 detach-internet-gateway --internet-gateway-id "$IGW" --vpc-id "$vpc" --region us-east-1 || true
              aws ec2 delete-internet-gateway --internet-gateway-id "$IGW" --region us-east-1 || true
            fi
            SGS=$(aws ec2 describe-security-groups --filters "Name=vpc-id,Values=$vpc" \
              --query 'SecurityGroups[?GroupName!=`default`].GroupId' --output text --region us-east-1 || echo "")
            for sg in $SGS; do aws ec2 delete-security-group --group-id "$sg" --region us-east-1 2>/dev/null || true; done
            aws ec2 delete-vpc --vpc-id "$vpc" --region us-east-1 || true
          done
          echo "VPC cleanup done."

      # ─────────────────────────────────────────────────────
      # 4. Terraform Init
      # ─────────────────────────────────────────────────────
      - name: Setup Terraform
        if: env.AWS_KEY != ''
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Terraform Init
        if: env.AWS_KEY != ''
        working-directory: ./terraform
        run: terraform init

      # ─────────────────────────────────────────────────────
      # 5. Import existing AWS resources into Terraform state
      #    → This is the "ignore if exists" mechanism.
      #    → If resource exists: import it (no error on apply)
      #    → If resource doesn't exist: import fails silently (|| true)
      #      and terraform apply creates it fresh
      # ─────────────────────────────────────────────────────
      - name: Import Existing AWS Resources into Terraform State
        if: env.AWS_KEY != ''
        working-directory: ./terraform
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          REGION="us-east-1"
          P="ticketdesk"

          echo "=== Importing ECR Repositories ==="
          terraform import aws_ecr_repository.eureka_server      ${P}-eureka-server      2>/dev/null || true
          terraform import aws_ecr_repository.frontend           ${P}-frontend           2>/dev/null || true
          terraform import aws_ecr_repository.api_gateway        ${P}-api-gateway        2>/dev/null || true
          terraform import aws_ecr_repository.auth_service       ${P}-auth-service       2>/dev/null || true
          terraform import aws_ecr_repository.ticket_service     ${P}-ticket-service     2>/dev/null || true
          terraform import aws_ecr_repository.comment_service    ${P}-comment-service    2>/dev/null || true
          terraform import aws_ecr_repository.attachment_service ${P}-attachment-service 2>/dev/null || true
          terraform import aws_ecr_repository.dashboard_service  ${P}-dashboard-service  2>/dev/null || true

          echo "=== Importing CloudWatch Log Group ==="
          terraform import aws_cloudwatch_log_group.ecs /ecs/${P} 2>/dev/null || true

          echo "=== Importing IAM Roles ==="
          terraform import aws_iam_role.ecs_execution_role ${P}-ecs-execution-role 2>/dev/null || true
          terraform import aws_iam_role.ecs_task_role      ${P}-ecs-task-role      2>/dev/null || true

          echo "=== Importing IAM Role Policy Attachments ==="
          terraform import aws_iam_role_policy_attachment.ecs_execution_policy \
            "${P}-ecs-execution-role/arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy" 2>/dev/null || true
          terraform import aws_iam_role_policy_attachment.ecs_ecr_policy \
            "${P}-ecs-execution-role/arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly" 2>/dev/null || true

          echo "=== Importing Secrets Manager Secret ==="
          SECRET_ARN=$(aws secretsmanager describe-secret \
            --secret-id ${P}-db-credentials-v2 \
            --query ARN --output text --region $REGION 2>/dev/null || echo "")
          [ -n "$SECRET_ARN" ] && [ "$SECRET_ARN" != "None" ] && \
            terraform import aws_secretsmanager_secret.db_secret "$SECRET_ARN" 2>/dev/null || true

          echo "=== Importing RDS Subnet Group ==="
          terraform import aws_db_subnet_group.main ${P}-db-subnet-group 2>/dev/null || true

          echo "=== Importing RDS Instance (if exists, takes ~2min) ==="
          RDS_EXISTS=$(aws rds describe-db-instances \
            --db-instance-identifier ${P}-db \
            --query 'DBInstances[0].DBInstanceIdentifier' \
            --output text --region $REGION 2>/dev/null || echo "")
          [ -n "$RDS_EXISTS" ] && [ "$RDS_EXISTS" != "None" ] && \
            terraform import aws_db_instance.mysql ${P}-db 2>/dev/null || true

          echo "=== Importing ECS Cluster ==="
          terraform import aws_ecs_cluster.main ${P}-cluster 2>/dev/null || true

          echo "=== Import complete! Any existing resources are now in Terraform state. ==="

      # ─────────────────────────────────────────────────────
      # 6. Terraform Apply (create new + update existing)
      # ─────────────────────────────────────────────────────
      - name: Terraform Apply
        if: env.AWS_KEY != ''
        working-directory: ./terraform
        run: terraform apply -auto-approve
        env:
          TF_VAR_aws_region: us-east-1

      # ─────────────────────────────────────────────────────
      # 7. Build & Deploy React Frontend to S3
      # ─────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Build React Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Deploy Frontend to S3
        if: env.AWS_KEY != ''
        run: |
          BUCKET=$(aws s3api list-buckets \
            --query "Buckets[?starts_with(Name, 'ticketdesk-frontend')].Name" \
            --output text 2>/dev/null | tr '\t' '\n' | head -n 1 || echo "")
          if [ -n "$BUCKET" ] && [ "$BUCKET" != "None" ]; then
            echo "Deploying frontend to s3://$BUCKET ..."
            aws s3 sync frontend/dist "s3://$BUCKET" --delete --region us-east-1
            echo "Frontend deployed!"
          else
            echo "No ticketdesk-frontend S3 bucket found, skipping."
          fi

      # ─────────────────────────────────────────────────────
      # 8. Login to ECR
      # ─────────────────────────────────────────────────────
      - name: Login to Amazon ECR
        if: env.AWS_KEY != ''
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # ─────────────────────────────────────────────────────
      # 9. Build & Push all Docker images to ECR
      # ─────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Push All Docker Images to ECR
        if: env.AWS_KEY != ''
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          TAG=$(git rev-parse --short HEAD)
          echo "Image tag: $TAG"

          push_image() {
            local name=$1
            local ctx=$2
            echo "--- Building ticketdesk-${name} ---"
            docker build \
              -t $ECR_REGISTRY/ticketdesk-${name}:${TAG} \
              -t $ECR_REGISTRY/ticketdesk-${name}:latest \
              ${ctx}
            docker push $ECR_REGISTRY/ticketdesk-${name}:${TAG}
            docker push $ECR_REGISTRY/ticketdesk-${name}:latest
            echo "--- ticketdesk-${name} pushed ---"
          }

          push_image "eureka-server"      "./backend/eureka-server"
          push_image "api-gateway"        "./backend/api-gateway"
          push_image "auth-service"       "./backend/auth-service"
          push_image "ticket-service"     "./backend/ticket-service"
          push_image "comment-service"    "./backend/comment-service"
          push_image "attachment-service" "./backend/attachment-service"
          push_image "dashboard-service"  "./backend/dashboard-service"
          push_image "frontend"           "./frontend"

      # ─────────────────────────────────────────────────────
      # 10. Force ECS redeployment with latest ECR images
      # ─────────────────────────────────────────────────────
      - name: Force ECS Redeployment
        if: env.AWS_KEY != ''
        run: |
          CLUSTER="ticketdesk-cluster"
          echo "=== Forcing ECS redeployment ==="
          for svc in \
            ticketdesk-eureka-service \
            ticketdesk-gateway-service \
            ticketdesk-auth-service \
            ticketdesk-ticket-service \
            ticketdesk-comment-service \
            ticketdesk-attachment-service \
            ticketdesk-dashboard-service; do
            echo "Redeploying: $svc"
            aws ecs update-service \
              --cluster "$CLUSTER" \
              --service "$svc" \
              --force-new-deployment \
              --region us-east-1 2>/dev/null || true
          done
          echo "=== All services redeployed! ==="

      # ─────────────────────────────────────────────────────
      # 11. Print access URLs
      # ─────────────────────────────────────────────────────
      - name: Print Access URLs
        if: env.AWS_KEY != ''
        working-directory: ./terraform
        run: |
          echo "=========================================================="
          echo " 🎉 DEPLOYMENT COMPLETE!"
          echo "=========================================================="
          echo " Frontend  : $(terraform output -raw frontend_s3_url 2>/dev/null || echo 'see S3 bucket')"
          echo " Eureka    : $(terraform output -raw eureka_dashboard_url 2>/dev/null || echo 'see ALB:8761')"
          echo " API GW    : $(terraform output -raw api_gateway_url 2>/dev/null || echo 'see ALB:80')"
          echo "=========================================================="
