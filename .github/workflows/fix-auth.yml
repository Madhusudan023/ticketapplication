name: Fix Auth Service - Reset RDS Password + Redeploy

on:
  workflow_dispatch:

jobs:
  fix-auth:
    name: Reset RDS Password and Redeploy Auth Service
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      CLUSTER: ticketdesk-cluster
      DB_ID: ticketdesk-db
      DB_PASS: TicketDeskPass123!
      DB_USER: admin

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # ─────────────────────────────────────────────────────────────────────
      # Step 1: Explicitly reset the RDS master password so it matches
      #         what the ECS tasks are sending (TicketDeskPass123!)
      # ─────────────────────────────────────────────────────────────────────
      - name: Reset RDS Master Password
        run: |
          echo "=== Resetting RDS master password to TicketDeskPass123! ==="
          aws rds modify-db-instance \
            --db-instance-identifier ${{ env.DB_ID }} \
            --master-user-password "${{ env.DB_PASS }}" \
            --apply-immediately \
            --region ${{ env.AWS_REGION }}

          echo "Waiting for RDS to apply password change..."
          # Wait until DB is available again (password change takes ~30s)
          for i in $(seq 1 20); do
            STATUS=$(aws rds describe-db-instances \
              --db-instance-identifier ${{ env.DB_ID }} \
              --query 'DBInstances[0].DBInstanceStatus' \
              --output text --region ${{ env.AWS_REGION }} 2>/dev/null || echo "unknown")
            echo "  Attempt $i: RDS status = $STATUS"
            if [ "$STATUS" = "available" ]; then
              echo "✅ RDS is available"
              break
            fi
            sleep 15
          done

          # Print the RDS endpoint for verification
          RDS_ENDPOINT=$(aws rds describe-db-instances \
            --db-instance-identifier ${{ env.DB_ID }} \
            --query 'DBInstances[0].Endpoint.Address' \
            --output text --region ${{ env.AWS_REGION }})
          echo "RDS Endpoint: $RDS_ENDPOINT"

      # ─────────────────────────────────────────────────────────────────────
      # Step 2: Build & push only the auth-service Docker image
      # ─────────────────────────────────────────────────────────────────────
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Push auth-service Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "=== Building ticketdesk-auth-service ==="
          docker build \
            -t $ECR_REGISTRY/ticketdesk-auth-service:latest \
            ./backend/auth-service
          docker push $ECR_REGISTRY/ticketdesk-auth-service:latest
          echo "✅ Auth service image pushed"

      # ─────────────────────────────────────────────────────────────────────
      # Step 3: Get current task definition and update its env vars
      #         to ensure correct DB URL + password are set
      # ─────────────────────────────────────────────────────────────────────
      - name: Update Auth Service Task Definition
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          R="us-east-1"
          CLUSTER="${{ env.CLUSTER }}"

          # Get current RDS endpoint
          RDS_HOST=$(aws rds describe-db-instances \
            --db-instance-identifier ${{ env.DB_ID }} \
            --query 'DBInstances[0].Endpoint.Address' \
            --output text --region $R)
          echo "RDS Host: $RDS_HOST"

          # Get ALB DNS for Eureka URL
          ALB=$(aws elbv2 describe-load-balancers \
            --names ticketdesk-alb \
            --query 'LoadBalancers[0].DNSName' \
            --output text --region $R 2>/dev/null || echo "")
          EUREKA_URL="http://${ALB}:8761/eureka/"
          echo "Eureka URL: $EUREKA_URL"

          DB_URL="jdbc:mysql://${RDS_HOST}:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true"
          echo "DB URL: $DB_URL"

          # Get current task definition
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition ticketdesk-auth-service \
            --query 'taskDefinition' \
            --region $R 2>/dev/null || echo "")

          if [ -z "$TASK_DEF" ] || [ "$TASK_DEF" = "null" ]; then
            echo "⚠️  No existing task definition — will use ECS update-service with force-new-deployment only"
          else
            # Build new environment array
            EXEC_ROLE=$(echo "$TASK_DEF" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('executionRoleArn',''))")
            TASK_ROLE=$(echo "$TASK_DEF" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('taskRoleArn',''))")
            CPU=$(echo "$TASK_DEF" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('cpu','512'))")
            MEM=$(echo "$TASK_DEF" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('memory','1024'))")

            cat > /tmp/new-task-def.json << EOF
          {
            "family": "ticketdesk-auth-service",
            "networkMode": "awsvpc",
            "requiresCompatibilities": ["FARGATE"],
            "cpu": "${CPU}",
            "memory": "${MEM}",
            "executionRoleArn": "${EXEC_ROLE}",
            "taskRoleArn": "${TASK_ROLE}",
            "containerDefinitions": [
              {
                "name": "auth-service",
                "image": "${ECR_REGISTRY}/ticketdesk-auth-service:latest",
                "essential": true,
                "portMappings": [{"containerPort": 8089, "hostPort": 8089, "protocol": "tcp"}],
                "environment": [
                  {"name": "EUREKA_CLIENT_SERVICEURL_DEFAULTZONE", "value": "${EUREKA_URL}"},
                  {"name": "EUREKA_URI",                           "value": "${EUREKA_URL}"},
                  {"name": "SPRING_DATASOURCE_URL",      "value": "${DB_URL}"},
                  {"name": "SPRING_DATASOURCE_USERNAME", "value": "${{ env.DB_USER }}"},
                  {"name": "SPRING_DATASOURCE_PASSWORD", "value": "${{ env.DB_PASS }}"}
                ],
                "logConfiguration": {
                  "logDriver": "awslogs",
                  "options": {
                    "awslogs-group": "/ecs/ticketdesk",
                    "awslogs-region": "${R}",
                    "awslogs-stream-prefix": "auth",
                    "awslogs-create-group": "true"
                  }
                }
              }
            ]
          }
          EOF
            echo "Registering new task definition..."
            NEW_TASK_ARN=$(aws ecs register-task-definition \
              --cli-input-json file:///tmp/new-task-def.json \
              --query 'taskDefinition.taskDefinitionArn' \
              --output text --region $R)
            echo "New task def: $NEW_TASK_ARN"

            echo "Updating ECS service to use new task definition..."
            aws ecs update-service \
              --cluster "$CLUSTER" \
              --service ticketdesk-auth-service \
              --task-definition "$NEW_TASK_ARN" \
              --force-new-deployment \
              --region $R
          fi

      # ─────────────────────────────────────────────────────────────────────
      # Step 4: Force redeploy auth-service and wait for it to stabilize
      # ─────────────────────────────────────────────────────────────────────
      - name: Force Redeploy Auth Service
        run: |
          aws ecs update-service \
            --cluster ${{ env.CLUSTER }} \
            --service ticketdesk-auth-service \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }} 2>/dev/null || true
          echo "✅ Auth service redeployment triggered"

      - name: Wait for Auth Service to Stabilize
        run: |
          echo "Waiting for auth-service to reach RUNNING state..."
          aws ecs wait services-stable \
            --cluster ${{ env.CLUSTER }} \
            --services ticketdesk-auth-service \
            --region ${{ env.AWS_REGION }} 2>/dev/null || echo "⚠️ Timeout — check ECS console"
          echo "✅ Auth service is stable"

      # ─────────────────────────────────────────────────────────────────────
      # Step 5: Test the login endpoint directly
      # ─────────────────────────────────────────────────────────────────────
      - name: Test Login Endpoint
        run: |
          sleep 30
          ALB=$(aws elbv2 describe-load-balancers \
            --names ticketdesk-alb \
            --query 'LoadBalancers[0].DNSName' \
            --output text --region ${{ env.AWS_REGION }} 2>/dev/null || echo "")
          echo "Testing: http://$ALB/api/v1/auth/login"
          RESULT=$(curl -s -o /tmp/login_response.json -w "%{http_code}" \
            -X POST "http://$ALB/api/v1/auth/login" \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@ticketdesk.com","password":"admin123"}' \
            --max-time 30 || echo "CURL_FAILED")
          echo "HTTP Status: $RESULT"
          echo "Response:"
          cat /tmp/login_response.json 2>/dev/null || echo "(no response)"

          if [ "$RESULT" = "200" ]; then
            echo ""
            echo "✅ LOGIN SUCCESSFUL!"
            echo "   Admin credentials: admin@ticketdesk.com / admin123"
          else
            echo ""
            echo "⚠️ Login returned $RESULT — check CloudWatch logs:"
            echo "   https://${{ env.AWS_REGION }}.console.aws.amazon.com/cloudwatch/home?region=${{ env.AWS_REGION }}#logsV2:log-groups/log-group/\$252Fecs\$252Fticketdesk"
          fi
